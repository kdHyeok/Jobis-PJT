# 이 파일은 이미지 안에서 /etc/nginx/templates/default.conf.template 로 복사되어
# 기동 시 envsubst 로 렌더링된다. listen 포트와 백엔드 업스트림은 반드시 환경변수로
# 남겨야 한다 — 운영은 network_mode: host 라 서비스명 DNS(backend)가 없고
# (BACKEND_UPSTREAM=http://127.0.0.1:8080), 8080 은 backend 가 쓰므로 listen 을
# 하드코딩하면 포트 충돌로 기동 자체가 실패한다 (NGINX_PORT: 로컬 8080 / 운영 8088).
# 실측 2026-08-08: 하드코딩 커밋이 배포에서 'host not found in upstream "backend"'
# crashloop 을 만들어 릴리스가 롤백됐다.
server {
    listen ${NGINX_PORT};
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 660s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite normally emits content-hashed JavaScript and CSS names, but an
    # unchanged output name must never pin an older application shell in a
    # user's browser. Revalidate executable assets on every navigation so a
    # recreated frontend container becomes visible without a manual cache
    # clear. The browser can still reuse a 304 response when the file is
    # unchanged.
    location ~* \.(?:js|css)$ {
        expires off;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location ~* \.(?:woff2|png|jpg|jpeg|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
