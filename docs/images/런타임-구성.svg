<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" width="900" height="570" role="img" aria-label="JOBIS 운영 런타임 구성 — 호스트 프로세스와 Compose 프로젝트 jobis-v2 분리">
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
    .t    { fill: #0f172a; }
    .tdim { fill: #4b5563; }
    .name { font-size: 14px; font-weight: 600; }
    .role { font-size: 11.5px; }
    .glabel { font-size: 11.5px; font-weight: 600; letter-spacing: .2px; }
    .edge { font-size: 11px; }
    .ctr   { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.4; }
    .host  { fill: #f8fafc; stroke: #64748b; stroke-width: 1.4; stroke-dasharray: 6 4; }
    .grp   { fill: none; stroke: #0f172a; stroke-width: 1.6; }
    .sub   { fill: none; stroke: #94a3b8; stroke-width: 1.2; }
    .out   { fill: none; stroke: #64748b; stroke-width: 1.4; stroke-dasharray: 6 4; }
    .flow  { stroke: #0f172a; stroke-width: 1.6; fill: none; }
    .user  { fill: #f1f5f9; stroke: #0f172a; stroke-width: 1.6; }
    @media (prefers-color-scheme: dark) {
      .t    { fill: #e5e9f0; }
      .tdim { fill: #a8b3c2; }
      .ctr  { fill: #17364f; stroke: #38bdf8; }
      .host { fill: #1e293b; stroke: #94a3b8; }
      .grp  { stroke: #e5e9f0; }
      .sub  { stroke: #64748b; }
      .out  { stroke: #94a3b8; }
      .flow { stroke: #e5e9f0; }
      .user { fill: #1e293b; stroke: #e5e9f0; }
      marker path { fill: #e5e9f0; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/>
    </marker>
  </defs>

  <rect class="user" x="380" y="12" width="140" height="34" rx="17"/>
  <text class="t name" x="450" y="34" text-anchor="middle">사용자</text>
  <line class="flow" x1="450" y1="46" x2="450" y2="70" marker-end="url(#a)"/>
  <text class="tdim edge" x="462" y="63">HTTPS :443</text>

  <rect class="host" x="20" y="74" width="860" height="80" rx="8"/>
  <text class="tdim glabel" x="34" y="93">호스트 프로세스</text>
  <text class="t name" x="450" y="118" text-anchor="middle">Nginx 1.24 (호스트) — TLS 종료</text>
  <text class="tdim role" x="450" y="137" text-anchor="middle">경로별 서비스 분배 · 무중단 전환용 upstream include</text>

  <line class="flow" x1="196" y1="154" x2="196" y2="192" marker-end="url(#a)"/>
  <text class="tdim edge" x="204" y="176">/</text>
  <line class="flow" x1="526" y1="154" x2="526" y2="192" marker-end="url(#a)"/>
  <text class="tdim edge" x="534" y="176">/airflow/</text>
  <line class="flow" x1="798" y1="154" x2="798" y2="192" marker-end="url(#a)"/>
  <text class="tdim edge" x="806" y="176">/jenkins/</text>

  <rect class="grp" x="20" y="196" width="680" height="264" rx="8"/>
  <text class="t glabel" x="34" y="215">Compose 프로젝트 jobis-v2 — 커밋 SHA 태그 이미지 6종</text>

  <rect class="sub" x="36" y="228" width="316" height="204" rx="6"/>
  <text class="tdim glabel" x="48" y="246">애플리케이션</text>
  <rect class="ctr" x="49" y="256" width="290" height="52" rx="5"/>
  <text class="t name" x="61" y="277">frontend · :8088</text>
  <text class="tdim role" x="61" y="296">SPA 정적 파일 + /api 프록시 (이미지 내 nginx)</text>
  <rect class="ctr" x="49" y="316" width="290" height="52" rx="5"/>
  <text class="t name" x="61" y="337">backend · :8080</text>
  <text class="tdim role" x="61" y="356">정본 상태 · 인증 · 분석 잡 오케스트레이션</text>
  <rect class="ctr" x="49" y="376" width="290" height="52" rx="5"/>
  <text class="t name" x="61" y="397">ai · :8000</text>
  <text class="tdim role" x="61" y="416">공고 구조화 · 적합도 · 역량 정규화 · 로드맵</text>

  <rect class="sub" x="368" y="228" width="316" height="204" rx="6"/>
  <text class="tdim glabel" x="380" y="246">데이터 파이프라인</text>
  <rect class="ctr" x="381" y="256" width="290" height="52" rx="5"/>
  <text class="t name" x="393" y="277">airflow-webserver · :8081</text>
  <text class="tdim role" x="393" y="296">DAG 상태 조회 · 수동 트리거 (운영자용)</text>
  <rect class="ctr" x="381" y="316" width="290" height="52" rx="5"/>
  <text class="t name" x="393" y="337">airflow-scheduler</text>
  <text class="tdim role" x="393" y="356">수집 · OCR · 적재 · 색인 DAG 실행 (포트 없음)</text>
  <rect class="ctr" x="381" y="376" width="290" height="52" rx="5"/>
  <text class="t name" x="393" y="397">rag-search · :8765</text>
  <text class="tdim role" x="393" y="416">공고 추천 — 벡터 + BM25 하이브리드 검색</text>

  <text class="tdim role" x="360" y="450" text-anchor="middle">전부 network_mode: host — 서비스 간 통신은 localhost, 개별 포트 발행 없음</text>

  <rect class="out" x="716" y="196" width="164" height="130" rx="8"/>
  <text class="tdim glabel" x="728" y="215">Compose 밖 컨테이너</text>
  <rect class="ctr" x="729" y="228" width="138" height="82" rx="5"/>
  <text class="t name" x="741" y="252">Jenkins · :9090</text>
  <text class="tdim role" x="741" y="271">127.0.0.1 바인딩</text>
  <text class="tdim role" x="741" y="288">3단 게이트 · 이미지 승격</text>
  <text class="tdim role" x="741" y="303">호스트 Docker socket 공유</text>

  <line class="flow" x1="196" y1="460" x2="196" y2="480" marker-end="url(#a)"/>
  <text class="tdim edge" x="204" y="475">JDBC</text>
  <line class="flow" x1="526" y1="460" x2="526" y2="480" marker-end="url(#a)"/>
  <text class="tdim edge" x="534" y="475">psycopg · pgvector</text>

  <rect class="host" x="20" y="484" width="860" height="76" rx="8"/>
  <text class="tdim glabel" x="34" y="503">호스트 프로세스</text>
  <text class="t name" x="450" y="527" text-anchor="middle">PostgreSQL 16.14 — 127.0.0.1:5432 loopback 전용</text>
  <text class="tdim role" x="450" y="546" text-anchor="middle">jobiss_v2 (서비스 정본) · jobrag (벡터 색인) · airflow (메타)</text>
</svg>
