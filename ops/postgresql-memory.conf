# systemd drop-in: /etc/systemd/system/postgresql@.service.d/10-jobis-memory.conf
#
# DB 가 스왑으로 밀리면 모든 서비스가 함께 느려지고, OOM 대상이 되면 전체 장애다.
# MemoryMin 은 메모리 압박 시 회수 대상에서 이만큼을 보호하고,
# OOMScoreAdjust 는 OOM 킬러의 선택 순서에서 뒤로 민다.
#
# 2026-08-06 장애: 배치 작업이 7.1GB 까지 자라 시스템이 스래싱에 빠졌고
# 로그인조차 불가능했다. sshd·user.slice 와 함께 DB 도 보호한다.
[Service]
MemoryMin=1G
OOMScoreAdjust=-800
