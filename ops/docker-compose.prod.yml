# JOBISS production stack. Every project-owned runtime image is tagged with the
# Git commit SHA. PostgreSQL and TLS-terminating Nginx remain host-managed.

x-rag-model-env: &rag-model-env
  RAG_EMBED_PROVIDER: ${RAG_EMBED_PROVIDER:-local}
  RAG_EMBED_MODEL: ${RAG_EMBED_MODEL:-}
  RAG_LOCAL_EMBED_MODEL: ${RAG_LOCAL_EMBED_MODEL:-BAAI/bge-m3}
  RAG_GMS_EMBED_MODEL: ${RAG_GMS_EMBED_MODEL:-text-embedding-3-large}
  RAG_VECTOR_DIMENSIONS: ${RAG_VECTOR_DIMENSIONS:-1024}
  RAG_RERANK_PROVIDER: ${RAG_RERANK_PROVIDER:-local}
  RAG_RERANK_MODEL: ${RAG_RERANK_MODEL:-}
  RAG_LOCAL_RERANK_MODEL: ${RAG_LOCAL_RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
  RAG_GMS_RERANK_MODEL: ${RAG_GMS_RERANK_MODEL:-gpt-4.1-mini}
  RAG_LOCAL_CPU_THREADS: ${RAG_LOCAL_CPU_THREADS:-2}
  RAG_INGEST_CPUS: ${RAG_INGEST_CPUS:-2.0}
  RAG_EMBED_BATCH_SIZE: ${RAG_EMBED_BATCH_SIZE:-8}
  RAG_INGEST_WINDOW_SIZE: ${RAG_INGEST_WINDOW_SIZE:-64}
  RAG_LOCAL_RERANK_BATCH_SIZE: ${RAG_LOCAL_RERANK_BATCH_SIZE:-4}
  RAG_GMS_OPENAI_BASE_URL: ${RAG_GMS_OPENAI_BASE_URL:-https://gms.ssafy.io/gmsapi/api.openai.com/v1}
  RAG_GMS_TIMEOUT_SECONDS: ${RAG_GMS_TIMEOUT_SECONDS:-60}
  RAG_GMS_MAX_RETRIES: ${RAG_GMS_MAX_RETRIES:-2}
  RAG_GMS_RERANK_BATCH_SIZE: ${RAG_GMS_RERANK_BATCH_SIZE:-30}
  RAG_GMS_RERANK_MAX_CHARS: ${RAG_GMS_RERANK_MAX_CHARS:-1800}
  GMS_KEY: ${GMS_KEY:-}

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Seoul
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?AIRFLOW_FERNET_KEY is required}
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_DSN:?AIRFLOW_DB_DSN is required}
  AIRFLOW__WEBSERVER__WEB_SERVER_PORT: "8081"
  # Nginx 가 /airflow 경로로 프록시한다. 접두사를 base_url 에 포함해야 UI 가 만드는
  # 링크와 정적 자원 경로가 접두사를 유지한다. 기본값에도 접두사를 넣어 두어야
  # 헬스체크 경로(/airflow/health)가 환경과 무관하게 일정하다.
  AIRFLOW__WEBSERVER__BASE_URL: ${AIRFLOW_BASE_URL:-http://127.0.0.1:8081/airflow}
  # X-Forwarded-* 를 신뢰해 리다이렉트를 https 로 만든다.
  AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX: "true"
  # 세션 서명 키. 지정하지 않으면 워커마다 다른 키가 생겨 로그인이 임의로 풀린다.
  # 값을 바꾸면 기존 세션 쿠키가 전부 무효가 되므로, 삭제된 계정의 낡은 쿠키로
  # 500(NoneType has no attribute 'is_active')이 나는 상황도 함께 정리된다.
  AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:?AIRFLOW_WEBSERVER_SECRET_KEY is required}
  JOBRAG_PG_DSN: ${JOBRAG_PG_DSN:?JOBRAG_PG_DSN is required}

x-airflow-common: &airflow-common
  image: ${JOBIS_IMAGE_PREFIX:-}jobis-airflow:${JOBIS_SHA:?JOBIS_SHA is required}
  network_mode: host
  env_file:
    - /etc/jobis/jobis-v2.env
  environment: *airflow-env
  # 관측 최고치(webserver 976MB)의 2배. 상한은 예약이 아니라 천장이므로 합계가
  # 물리 메모리를 넘어도 되지만, 동시 최고치는 넘지 않도록 잡았다.
  mem_limit: 2g
  volumes:
    - airflow-logs:/opt/airflow/logs
    - crawl-state:/opt/jobis/DATA/data
    - crawl-exports:/opt/jobis/DATA/exports
    # jobis_legacy_import 가 읽는 레거시 SQLite 위치. 일회성 데이터라 릴리스 아카이브에
    # 넣지 않고 호스트에 두고 읽기 전용으로 빌려준다(원본을 컨테이너가 수정하지 못한다).
    # 파일이 없어도 빈 디렉토리로 보일 뿐이라 기동에는 영향이 없다.
    - /opt/jobis/imports:/opt/jobis/imports:ro
  restart: unless-stopped

services:
  jobrag-migrate:
    image: flyway/flyway:13.0.0-alpine
    network_mode: host
    command: -connectRetries=60 migrate
    env_file:
      - /etc/jobis/jobis-v2.env
    environment:
      FLYWAY_URL: ${JOBRAG_FLYWAY_URL:?JOBRAG_FLYWAY_URL is required}
      FLYWAY_USER: ${JOBRAG_DB_USER:-jobrag}
      FLYWAY_PASSWORD: ${JOBRAG_DB_PASSWORD:?JOBRAG_DB_PASSWORD is required}
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_BASELINE_VERSION: "0"
      FLYWAY_BASELINE_DESCRIPTION: pre-flyway-jobrag-schema
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - /opt/jobis/jobrag-migrations:/flyway/sql:ro
    restart: "no"

  rag-search:
    image: ${JOBIS_IMAGE_PREFIX:-}jobis-rag-search:${JOBIS_SHA:?JOBIS_SHA is required}
    container_name: jobis-rag-search
    network_mode: host
    env_file:
      - /etc/jobis/jobis-v2.env
    environment:
      <<: *rag-model-env
      PG_DSN: ${JOBRAG_PG_DSN:?JOBRAG_PG_DSN is required}
      HF_HOME: /hf
      OMP_NUM_THREADS: ${RAG_LOCAL_CPU_THREADS:-2}
      MKL_NUM_THREADS: ${RAG_LOCAL_CPU_THREADS:-2}
      OPENBLAS_NUM_THREADS: ${RAG_LOCAL_CPU_THREADS:-2}
      NUMEXPR_NUM_THREADS: ${RAG_LOCAL_CPU_THREADS:-2}
      RAYON_NUM_THREADS: ${RAG_LOCAL_CPU_THREADS:-2}
      TOKENIZERS_PARALLELISM: "false"
    cpus: ${RAG_SEARCH_CPUS:-2.0}
    # 관측 최고치 1.28GB. memswap 을 같게 두어 스왑으로 넘어가지 않게 한다
    # (스왑에 밀린 임베딩 모델은 응답이 초 단위로 무너진다).
    mem_limit: ${RAG_SEARCH_MEM_LIMIT:-3g}
    memswap_limit: ${RAG_SEARCH_MEM_LIMIT:-3g}
    volumes:
      - hf-cache:/hf
    depends_on:
      jobrag-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8765/health',timeout=3)); assert d['status']=='ok' and d['warm']"]
      interval: 15s
      timeout: 5s
      start_period: 10m
      retries: 40
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    restart: "no"
    command:
      - bash
      - -ec
      - |
        airflow db migrate
        airflow pools set ocr_pool 1 'PaddleOCR tasks run one at a time'
        # 메모리를 많이 쓰는 태스크(OCR·RAG 적재)를 한 번에 하나만 돌린다.
        # 2026-08-06 장애: 고정 임베딩 작업에 다른 배치가 겹쳐 전체 메모리가 소진됐다.
        airflow pools set heavy_memory_pool 1 'Memory-heavy tasks run one at a time'
        # 관리자 계정명을 환경변수로 둔다. 'admin' 으로 고정하면 운영에서 계정명을
        # 바꿔도 다음 배포 때 이 블록이 admin 을 다시 만들어 되돌려 놓는다.
        if ! airflow users list --output json | python -c 'import json,os,sys; want=os.environ["AIRFLOW_ADMIN_USERNAME"]; sys.exit(0 if any(u.get("username") == want for u in json.load(sys.stdin)) else 1)'; then
          airflow users create --username "$${AIRFLOW_ADMIN_USERNAME:?}" --password "$${AIRFLOW_ADMIN_PASSWORD:?}" --firstname Admin --lastname Admin --role Admin --email "$${AIRFLOW_ADMIN_EMAIL:-admin@example.com}"
        fi

  airflow-scheduler:
    <<: *airflow-common
    container_name: jobis-airflow-scheduler
    command: scheduler
    environment:
      <<: [*airflow-env, *rag-model-env]
      RAG_INGEST_IMAGE: ${JOBIS_IMAGE_PREFIX:-}jobis-rag-ingest:${JOBIS_SHA:?JOBIS_SHA is required}
      RAG_DOCKER_NETWORK_MODE: host
    # 관측 최고치 2.43GB(OCR·적재 태스크 포함). 공통값 2g 를 덮어쓴다.
    # memswap 을 더 크게 둬 순간 초과는 스왑으로 흡수한다 — 배치가 죽는 것보다 느린 편이 낫다.
    mem_limit: 4g
    memswap_limit: 6g
    group_add:
      - ${DOCKER_GID:-999}
    volumes:
      - airflow-logs:/opt/airflow/logs
      - crawl-state:/opt/jobis/DATA/data
      - crawl-exports:/opt/jobis/DATA/exports
      - ocr-paddlex-cache:/home/airflow/.paddlex
      - ocr-paddle-cache:/home/airflow/.paddleocr
      - /var/run/docker.sock:/var/run/docker.sock
      # 태스크는 LocalExecutor 로 이 컨테이너에서 실행되므로 여기에도 필요하다
      # (scheduler 는 x-airflow-common 의 volumes 를 상속하지 않고 덮어쓴다).
      - /opt/jobis/imports:/opt/jobis/imports:ro
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      jobrag-migrate:
        condition: service_completed_successfully

  airflow-webserver:
    <<: *airflow-common
    container_name: jobis-airflow-webserver
    command: webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      jobrag-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/airflow/health >/dev/null"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 20

  ai:
    image: ${JOBIS_IMAGE_PREFIX:-}jobis-ai:${JOBIS_SHA:?JOBIS_SHA is required}
    container_name: jobis-ai
    network_mode: host
    env_file:
      - /etc/jobis/jobis-v2.env
    environment:
      SESSION_STORE: sqlite
      SESSION_DB_PATH: /var/lib/jobis-ai/sessions.sqlite3
      JOBIS_AUDIT_LOG: /var/lib/jobis-ai/logs/audit.jsonl
      CODEX_OAUTH_STATE_DIR: /var/lib/jobis-ai/codex
    # 관측 최고치 79MB. LLM 응답 버퍼가 커질 여지를 두되 스왑은 막는다.
    mem_limit: 2g
    memswap_limit: 2g
    volumes:
      - /var/lib/jobis-ai:/var/lib/jobis-ai
    depends_on:
      rag-search:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)); assert d['status']=='ok' and d['service']=='jobis-ai-v2bridge'"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 10
    restart: unless-stopped

  backend:
    image: ${JOBIS_IMAGE_PREFIX:-}jobis-backend:${JOBIS_SHA:?JOBIS_SHA is required}
    container_name: jobis-backend
    network_mode: host
    env_file:
      - /etc/jobis/jobis-v2.env
    # 이미지가 -XX:MaxRAMPercentage=75 로 실행되므로 이 상한이 곧 힙 상한이다.
    # 상한이 없으면 JVM 이 호스트 전체(15.6GB)를 기준으로 계산해 힙을 12GB 까지 잡는다
    # (실측: 상한 없음 → 11,992MB, 상한 3g → 2,304MB).
    mem_limit: ${BACKEND_MEM_LIMIT:-3g}
    memswap_limit: ${BACKEND_MEM_LIMIT:-3g}
    depends_on:
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 20
    restart: unless-stopped

  frontend:
    image: ${JOBIS_IMAGE_PREFIX:-}jobis-frontend:${JOBIS_SHA:?JOBIS_SHA is required}
    container_name: jobis-frontend
    network_mode: host
    # 정적 파일 서빙 nginx. 관측 최고치 8MB.
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      NGINX_PORT: "8088"
      BACKEND_UPSTREAM: http://127.0.0.1:8080
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8088/"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 10
    restart: unless-stopped

volumes:
  airflow-logs:
    name: jobis-airflow-logs
  crawl-state:
    name: jobis-crawl-state
  crawl-exports:
    name: jobis-crawl-exports
  hf-cache:
    name: jobis-hf-cache
  ocr-paddlex-cache:
    name: jobis-ocr-paddlex-cache
  ocr-paddle-cache:
    name: jobis-ocr-paddle-cache
