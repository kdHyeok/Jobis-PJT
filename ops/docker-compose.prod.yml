# JOBISS production application stack.
#
# PostgreSQL, host Nginx/TLS, Jenkins, and the optional Airflow/RAG stack stay
# on the host during this cutover. The three application processes are
# immutable images tagged with the Git commit SHA. Host networking preserves
# the existing loopback-only DB/RAG/Nginx contracts without widening pg_hba.

services:
  ai:
    image: ${JOBIS_IMAGE_PREFIX:-}jobis-ai:${JOBIS_SHA:?JOBIS_SHA is required}
    container_name: jobis-ai
    network_mode: host
    env_file:
      - /etc/jobis/jobis-v2.env
    environment:
      SESSION_STORE: sqlite
      SESSION_DB_PATH: /var/lib/jobis-ai/sessions.sqlite3
      JOBIS_AUDIT_LOG: /var/lib/jobis-ai/logs/audit.jsonl
      CODEX_OAUTH_STATE_DIR: /var/lib/jobis-ai/codex
    volumes:
      - /var/lib/jobis-ai:/var/lib/jobis-ai
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)); assert d['status']=='ok' and d['service']=='jobis-ai-v2bridge'"
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 10
    restart: unless-stopped

  backend:
    image: ${JOBIS_IMAGE_PREFIX:-}jobis-backend:${JOBIS_SHA:?JOBIS_SHA is required}
    container_name: jobis-backend
    network_mode: host
    env_file:
      - /etc/jobis/jobis-v2.env
    depends_on:
      ai:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q --spider http://127.0.0.1:8080/api/health"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 20
    restart: unless-stopped

  frontend:
    image: ${JOBIS_IMAGE_PREFIX:-}jobis-frontend:${JOBIS_SHA:?JOBIS_SHA is required}
    container_name: jobis-frontend
    network_mode: host
    environment:
      NGINX_PORT: "8088"
      BACKEND_UPSTREAM: http://127.0.0.1:8080
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q --spider http://127.0.0.1:8088/"
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 10
    restart: unless-stopped
