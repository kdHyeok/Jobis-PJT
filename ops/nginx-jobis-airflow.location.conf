# Include this file inside the existing HTTPS server block after review.
#
# Airflow 웹서버는 AIRFLOW__WEBSERVER__BASE_URL 의 경로 접두사(/airflow)로 서비스된다.
# 그래서 proxy_pass 에 URI 를 붙이면 안 된다. "http://127.0.0.1:8081/" 처럼 슬래시를
# 붙이면 nginx 가 /airflow 접두사를 잘라내고 전달해 Airflow 가 404 를 돌려준다.
location = /airflow {
    return 301 /airflow/;
}

location /airflow/ {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    # 로그 스트리밍과 긴 목록 조회를 위해 기본값보다 넉넉히 준다.
    proxy_read_timeout 300s;
    client_max_body_size 20m;
}
