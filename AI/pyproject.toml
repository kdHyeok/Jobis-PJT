[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobis-ai"
version = "0.1.0"
description = "자비스(잡퀘스트) 취업 준비 멀티에이전트 AI 서버"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.2.0",  # GMS(SSAFY 게이트웨이) 경유 OpenAI 호환 LLM 호출 (llm.py)
    "openai>=1.0",              # GMS 경유 임베딩 직접 호출 (embed_impl/gms_openai.py)
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "python-docx>=1.1",   # 이력서/공고 .docx 텍스트 추출 (extract.py)
    "pypdf>=4.0",         # 이력서/공고 .pdf 텍스트 추출 (extract.py)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
prototype = [
    "fastapi>=0.110",          # 프로토타입 관찰 UI (개발 전용, prototype/)
    "uvicorn>=0.29",
    "python-multipart>=0.0.9", # 파일 업로드(multipart form) 파싱 (/api/upload)
    "websockets>=12",          # 웹 브릿지의 WebSocket 서버 (webbridge/, 웹백엔드가 접속)
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
