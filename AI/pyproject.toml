[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobis-ai"
version = "0.1.0"
description = "자비스(잡퀘스트) 취업 준비 멀티에이전트 AI 서버"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.2.0",  # GMS(SSAFY 게이트웨이) 경유 OpenAI 호환 LLM 호출 (llm.py)
    "openai>=1.0",              # GMS 경유 임베딩 직접 호출 (embed_impl/gms_openai.py)
    "httpx>=0.28,<1",           # Codex OAuth/Responses SSE adapter
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "python-docx>=1.1",   # 이력서/공고 .docx 텍스트 추출 (extract.py)
    "pypdf>=4.0",         # 이력서/공고 .pdf 텍스트 추출 (extract.py)
    # 이미지 공고를 VLM 이 받을 크기로 줄이고 세로로 쪼갠다 (feat_url/). 실측 2026-08-04:
    # 잡코리아 이미지 공고가 5.2MB·세로로 매우 긴 PNG 여서 Clova 가 40063 Invalid image size
    # 로 거부했다 — 필수요건·우대사항이 통째로 그 이미지 안에 있었다.
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
prototype = [
    "fastapi>=0.110",          # 프로토타입 관찰 UI (개발 전용, prototype/)
    "uvicorn>=0.29",
    "python-multipart>=0.0.9", # 파일 업로드(multipart form) 파싱 (/api/upload)
]

[project.scripts]
jobis-codex-oauth = "jobis_ai.codex_oauth_adapter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
