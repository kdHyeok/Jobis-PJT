# JOBIS 공용 역량 지식 그래프 시드 v2 — 이스트게임즈(게임 결제 도메인) 특화.
#
# 설계 입력 보존본이다. 런타임 정본은 아래 파일로 변환·승인되어 있다.
# career_pipeline/capability_graph/releases/graph-release.v0.2.0-alpha.1.yaml
# 아래 nodes/edges 설명은 변환 전 시드 구조를 기록하기 위해 유지한다.
#
# 출처 설계도: jobis-capability-knowledge-map.svg ("초기 시드 — 원자 역량 69개,
# 관계 92개, 프로젝트 과제 12개"). 이 파일은 그 설계도를 서버 계약
# (jobis.capability-graph.v1alpha1, capability_graph_server/app.py)으로 옮긴 것이다.
#
# 구성 원칙 (설계도 하단 명시):
#   · 레벨 숫자를 저장하지 않는다. 과제가 필요로 하는 노드를 target 으로,
#     이미 아는 노드를 boundary 로 주면 남은 선행지식만 로드맵이 된다.
#   · Kafka·Redis 는 공고에 등장했다는 이유만으로 필수 경로에 들어가지 않는다 —
#     해당 확장 과제(task.gamepay.*)를 선택했을 때만 그래프 모양상 연결된다.
#   · C(개념) = node_type CONCEPT + EXPLAIN 검증, P(수행) = PERFORMANCE.
#   · 프로젝트 과제 12개도 노드다(project_task_keys 로 조회) — kind
#     TECHNICAL_CAPABILITY, canonical_key 접두사 task.gamepay.*,
#     필수/추천/확장 구분은 objective 앞머리에 적는다(서버는 아직 소비하지 않는다).
#   · CONDITIONAL_PREREQUISITE 는 쓰지 않았다: 파이프라인이 보내는 활성 조건이
#     role/language 뿐인데 이 시드는 Java 단일 경로라 성립하는 조건부 관계가 없다.
#     다국어(예: Kotlin) 경로를 추가할 때 언어 분기 엣지로 도입한다.
#
# 노드/엣지 공통 기본값(node_type=PERFORMANCE, verification=[IMPLEMENT],
# relation_type=HARD_PREREQUISITE 등)은 app.py 의 NODE_DEFAULTS/EDGE_DEFAULTS 가 채운다.
graph_version: "0.2.0-alpha.1"

