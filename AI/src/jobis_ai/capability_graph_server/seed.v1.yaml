    source_ids: [source-postgres-docs]
  - canonical_key: java.classes-objects
    technology_key: lang.java
    display_name: "Java 클래스와 객체 모델링"
    kind: PROGRAMMING_LANGUAGE
    objective: "도메인을 클래스·인터페이스·상속으로 모델링해 구현할 수 있다."
