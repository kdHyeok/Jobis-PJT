nodes:
  - canonical_key: git.basic-workflow
    technology_key: tool.git
    display_name: "Git 기본 워크플로"
    kind: TOOL
    objective: "변경을 스테이징·커밋하고 브랜치를 만들어 병합할 수 있다."
    scope_definition: "add/commit/branch/merge/log 와 원격 push/pull 까지."
    excluded_scope: ["rebase 전략", "모노레포 운영"]
    source_ids: [source-git-scm]
  - canonical_key: http.request-response
    technology_key: protocol.http
    display_name: "HTTP 요청·응답 해석"
    kind: PROTOCOL
    objective: "메서드·상태 코드·헤더·바디로 구성된 HTTP 왕복을 해석할 수 있다."
    scope_definition: "요청/응답 구조, 주요 메서드와 상태 코드, 콘텐츠 협상까지."
    verification_methods: [EXPLAIN, DEBUG]
    source_ids: [source-mdn-http]
  - canonical_key: http.rest-resource-design
    technology_key: protocol.http
    display_name: "REST 리소스 설계"
    kind: PROTOCOL
    objective: "도메인을 리소스·URI·메서드 의미에 맞게 배치한 API 를 설계할 수 있다."
    scope_definition: "리소스 명명, 메서드/상태 코드 선택, 오류 표현까지."
    verification_methods: [DOCUMENT, IMPLEMENT]
    source_ids: [source-mdn-http]
  - canonical_key: sql.select-and-joins
    technology_key: lang.sql
    display_name: "SQL 조회와 조인"
    kind: DATABASE
    objective: "여러 테이블을 조인·집계하는 SELECT 질의를 작성할 수 있다."
    scope_definition: "SELECT/WHERE/JOIN/GROUP BY/ORDER BY 와 서브쿼리까지."
    source_ids: [source-postgres-docs]
  - canonical_key: sql.schema-and-constraints
    technology_key: lang.sql
    display_name: "스키마와 제약 조건 설계"
    kind: DATABASE
    objective: "정합성을 제약 조건으로 보장하는 테이블 스키마를 설계할 수 있다."
    scope_definition: "PK/FK/UNIQUE/CHECK, 인덱스 기초, 정규화 판단까지."
    source_ids: [source-postgres-docs]
