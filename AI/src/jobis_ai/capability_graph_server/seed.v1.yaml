  - canonical_key: java.collections-and-generics
    technology_key: lang.java
    display_name: "Java 컬렉션과 제네릭"
    kind: PROGRAMMING_LANGUAGE
    objective: "컬렉션 자료구조와 제네릭 타입을 목적에 맞게 선택해 사용할 수 있다."
    scope_definition: "List/Set/Map 선택 기준, 제네릭 선언과 와일드카드까지."
    source_ids: [source-dev-java]
  - canonical_key: java.exceptions-and-io
    technology_key: lang.java
    display_name: "Java 예외 처리와 입출력"
    kind: PROGRAMMING_LANGUAGE
    objective: "예외 계층을 설계하고 자원을 안전하게 여닫는 코드를 작성할 수 있다."
    scope_definition: "checked/unchecked 구분, try-with-resources, 기본 IO까지."
    source_ids: [source-dev-java]
  - canonical_key: build.gradle-project
    technology_key: tool.gradle
    display_name: "Gradle 프로젝트 구성"
    kind: TOOL
    objective: "의존성과 태스크를 선언해 Java 프로젝트를 빌드·실행할 수 있다."
    scope_definition: "build.gradle 의존성/플러그인 선언, 테스트·실행 태스크까지."
    source_ids: [source-gradle-docs]
  - canonical_key: test.junit-unit-testing
    technology_key: lib.junit
    display_name: "JUnit 단위 테스트 작성"
    kind: LIBRARY
    objective: "동작을 고정하는 단위 테스트를 JUnit 으로 작성할 수 있다."
    scope_definition: "라이프사이클/단언/파라미터라이즈, 실패 메시지 설계까지."
    verification_methods: [TEST]
    source_ids: [source-junit-docs]
  - canonical_key: spring.di-and-configuration
    technology_key: framework.spring-boot
    display_name: "Spring DI 컨테이너와 구성"
    kind: FRAMEWORK
    objective: "빈 등록과 주입, 프로필별 구성으로 애플리케이션을 조립할 수 있다."
    scope_definition: "컴포넌트 스캔, 생성자 주입, @Configuration/프로필까지."
    source_ids: [source-spring-boot-docs]
  - canonical_key: spring.mvc-controller
    technology_key: framework.spring-boot
    display_name: "Spring MVC 컨트롤러 구현"
    kind: FRAMEWORK
    objective: "요청 매핑·바인딩·응답 직렬화를 갖춘 컨트롤러를 구현할 수 있다."
    scope_definition: "@RestController, 요청/응답 바인딩, 예외 핸들러까지."
    source_ids: [source-spring-boot-docs]
  - canonical_key: spring.rest-api-implementation
    technology_key: framework.spring-boot
    display_name: "Spring REST API 구현"
    kind: FRAMEWORK
    objective: "설계된 리소스 계약대로 검증·오류 응답을 갖춘 REST API 를 구현할 수 있다."
    scope_definition: "입력 검증, 오류 envelope, 페이지네이션 관례까지."
    source_ids: [source-spring-boot-docs]
  - canonical_key: spring.data-jpa-repositories
    technology_key: framework.spring-boot
    display_name: "Spring Data JPA 리포지토리"
    kind: FRAMEWORK
    objective: "엔티티 매핑과 리포지토리로 영속 계층을 구현할 수 있다."
    scope_definition: "엔티티/연관관계 매핑, 파생 쿼리와 @Query 까지."
    source_ids: [source-spring-boot-docs]
  - canonical_key: spring.transaction-management
    technology_key: framework.spring-boot
    display_name: "Spring 트랜잭션 관리"
    kind: FRAMEWORK
    objective: "트랜잭션 경계를 선언하고 전파·롤백 규칙을 다룰 수 있다."
    scope_definition: "@Transactional 경계/전파/롤백 규칙, 읽기 전용 최적화까지."
    source_ids: [source-spring-boot-docs]
  - canonical_key: spring.security-authentication
    technology_key: framework.spring-boot
    display_name: "Spring Security 인증 구성"
    kind: FRAMEWORK
    objective: "필터 체인 기반 인증과 세션/토큰 전략을 구성할 수 있다."
    scope_definition: "필터 체인, 인증 공급자, 비밀번호 해시와 CSRF 방어까지."
    source_ids: [source-spring-boot-docs]
  - canonical_key: docker.container-basics
    technology_key: tool.docker
    display_name: "Docker 컨테이너 기초"
    kind: INFRASTRUCTURE
    objective: "애플리케이션을 이미지로 빌드해 컨테이너로 실행할 수 있다."
    scope_definition: "Dockerfile 작성, 이미지 빌드/실행, 포트·볼륨 매핑까지."
    source_ids: [source-docker-docs]

