<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>웹 브릿지 — 대화 확인용</title>
<style>
  :root{
    --bg:#12100e; --surface:#1a1714; --surface2:#221e1a; --line:#332d27; --line2:#453d35;
    --ink:#f0ebe4; --dim:#a89e92; --faint:#6f665c;
    --brand:#d8a24a; --ok:#5fb37a; --no:#d1654f; --tri:#d8a24a; --info:#6aa3c9;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.6 "Pretendard Variable",Pretendard,-apple-system,"Segoe UI","Malgun Gothic",sans-serif}
  .wrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:0;min-height:100vh}
  @media (max-width:1000px){.wrap{grid-template-columns:1fr}}

  header{display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--line);
    background:var(--surface);position:sticky;top:0;z-index:5}
  header h1{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em}
  .tag{font-size:11px;padding:3px 8px;border-radius:20px;border:1px solid var(--line2);color:var(--dim)}
  .tag.live{border-color:var(--ok);color:var(--ok)}
  .tag.dead{border-color:var(--no);color:var(--no)}
  .sp{flex:1}

  main{padding:20px 22px 60px;min-width:0}
  aside{border-left:1px solid var(--line);background:var(--surface);padding:20px 18px 60px;min-width:0}
  @media (max-width:1000px){aside{border-left:none;border-top:1px solid var(--line)}}

  label{display:block;font-size:12px;color:var(--dim);margin:14px 0 6px;font-weight:600}
  textarea,input{width:100%;background:var(--surface2);color:var(--ink);border:1px solid var(--line);
    border-radius:9px;padding:10px 12px;font:13px/1.55 ui-monospace,Consolas,monospace;resize:vertical}
  textarea:focus,input:focus{outline:none;border-color:var(--brand)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
  button{background:var(--brand);color:#20180c;border:0;border-radius:9px;padding:10px 16px;
    font-weight:700;font-size:13px;cursor:pointer}
  button.line{background:transparent;color:var(--ink);border:1px solid var(--line2)}
  button:disabled{opacity:.45;cursor:default}
  .hint{font-size:12px;color:var(--faint)}

  .stream{margin-top:8px}
  .ev{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
  .ev .pct{color:var(--faint);font:12px ui-monospace,Consolas,monospace;min-width:38px;text-align:right}
  .ev .who{color:var(--brand);font-weight:600;min-width:112px}
  .ev .what{color:var(--dim);min-width:0}
  .say{margin:14px 0;padding:13px 15px;background:var(--surface);border:1px solid var(--line);
    border-left:3px solid var(--ok);border-radius:0 9px 9px 0}
  .say .nm{font-size:11px;color:var(--ok);font-weight:700;margin-bottom:5px}
  .ctx{margin:14px 0;padding:13px 15px;background:var(--surface);border:1px solid var(--line);
    border-left:3px solid var(--info);border-radius:0 9px 9px 0;font-size:13px}
  .ctx .nm{font-size:11px;color:var(--info);font-weight:700;margin-bottom:5px}
  .err{margin:14px 0;padding:13px 15px;border:1px solid var(--no);border-radius:9px;color:var(--no)}

  .qcard{margin:16px 0;padding:15px 17px;background:var(--surface);border:1px solid var(--brand);
    border-radius:11px}
  .qcard .qk{font-size:11px;color:var(--brand);font-weight:700;letter-spacing:.02em}
  .qcard .qt{font-size:16px;font-weight:700;margin:7px 0 4px;line-height:1.45}
  .qcard .qw{font-size:12px;color:var(--dim);margin-bottom:11px}
  .qcard.answered{border-color:var(--line2);opacity:.72}
  .qcard .mine{margin-top:10px;font-size:13px;color:var(--ok)}

  .report{margin-top:22px;border-top:1px solid var(--line2);padding-top:20px}
  h2{font-size:13px;color:var(--dim);margin:24px 0 10px;font-weight:700;letter-spacing:.02em}
  .gauge{display:flex;align-items:baseline;gap:10px}
  .gauge b{font-size:38px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
  .gauge small{color:var(--faint);font-size:13px}
  .track{height:7px;background:var(--line);border-radius:20px;overflow:hidden;margin:11px 0 5px;display:flex}
  .track i{display:block;height:100%;background:var(--brand)}
  .track i.gain{background:color-mix(in srgb,var(--ok) 55%,transparent)}
  .judge{font-size:15px;font-weight:600;margin:10px 0 2px;line-height:1.5}

  .dec{margin:12px 0;padding:14px 16px;border-radius:11px;border:1px solid var(--line2);background:var(--surface)}
  .dec.block,.dec.caution{border-color:var(--tri)}
  .dec.ready{border-color:var(--ok)}
  .dec .bd{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;border:1px solid currentColor;
    display:inline-block;color:var(--tri)}
  .dec.ready .bd{color:var(--ok)}
  .dec .hl{font-size:15px;font-weight:700;margin:9px 0 7px;line-height:1.5}
  .dec ul{margin:0;padding-left:18px;font-size:13px;color:var(--dim)}
  .hc{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px}
  .hc .r{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;padding:4px 0}
  .hc .r b{font-weight:600}
  .hc .no{color:var(--no);font-size:11px;border:1px solid currentColor;border-radius:20px;padding:2px 7px}

  .g{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .mk{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;
    flex:none;border:1px solid currentColor;margin-top:2px}
  .mk.ok{color:var(--ok)} .mk.no{color:var(--no)} .mk.tri{color:var(--tri)}
  .g .t{font-weight:600;font-size:14px}
  .g .d{font-size:12.5px;color:var(--dim)}

  .step{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
  .step .sn{width:26px;height:26px;border-radius:8px;background:var(--surface2);border:1px solid var(--line2);
    display:grid;place-items:center;font:12px/1 ui-monospace,Consolas,monospace;flex:none;color:var(--dim)}
  .step.active .sn{border-color:var(--brand);color:var(--brand)}
  .step .st{font-weight:600;font-size:14px}
  .step .sm{font-size:12px;color:var(--faint)}
  .step .sd{margin-left:auto;color:var(--ok);font-size:12px;white-space:nowrap}
  .tags{margin-top:4px;display:flex;gap:5px;flex-wrap:wrap}
  .tags span{font-size:11px;color:var(--dim);border:1px solid var(--line2);border-radius:20px;padding:1px 8px}

  .rt{padding:12px 14px;border:1px solid var(--line2);border-radius:11px;margin-bottom:9px;background:var(--surface)}
  .rt .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
  .rt .k{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;border:1px solid var(--brand);color:var(--brand)}
  .rt .e{font-size:11px;color:var(--faint)}
  .rt .risk{font-size:11px;color:var(--no)}
  .rt .tt{font-weight:700;font-size:14px}
  .rt .ss{font-size:12.5px;color:var(--dim);margin-top:3px}
  .chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
  .chips span{font-size:11px;border-radius:20px;padding:2px 8px;border:1px solid var(--line2);color:var(--dim)}
  .chips span.o{color:var(--ok);border-color:currentColor}
  .chips span.m{color:var(--no);border-color:currentColor}

  .warn{font-size:12px;color:var(--faint);padding:5px 0;border-bottom:1px solid var(--line)}
  .warn code{color:var(--dim)}
  details summary{cursor:pointer;font-size:12px;color:var(--dim);margin-top:14px}
  pre{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:12px;
    overflow:auto;font-size:11.5px;max-height:420px}
  .empty{color:var(--faint);font-size:13px;padding:8px 0}
</style>
</head>
<body>
<div class="wrap">
  <main>
    <header>
      <h1>웹 브릿지 · 대화 확인</h1>
      <span class="tag" id="conn">대기</span>
      <span class="sp"></span>
      <span class="hint">웹백엔드와 같은 WS 계약으로 말합니다 — 여기서 보이는 게 브라우저에 중계되는 것과 같습니다</span>
    </header>

    <div id="setup">
      <label for="posting">공고 원문</label>
      <textarea id="posting" rows="12"></textarea>

      <label for="evidence">내 자료 — 한 줄에 <code>종류|이름|설명</code> (PROJECT/GITHUB/PORTFOLIO/STACK/EDU/CERT)</label>
      <textarea id="evidence" rows="8"></textarea>

      <div class="row">
        <label style="margin:0" for="company">회사명</label>
        <input id="company" style="width:150px" placeholder="(선택)">
        <label style="margin:0" for="role">직무</label>
        <input id="role" style="width:150px" placeholder="(선택)">
        <label style="margin:0" for="career">경력 조건</label>
        <input id="career" style="width:130px" placeholder="(선택)">
      </div>
      <div class="row">
        <button id="go">분석 시작</button>
        <button class="line" id="reset" style="display:none">새로 시작</button>
        <span class="hint" id="note">공고와 자료는 샘플이 채워져 있습니다. 그대로 눌러도 됩니다.</span>
      </div>
    </div>

    <div class="stream" id="stream"></div>
    <div id="report"></div>
  </main>

  <aside>
    <h2 style="margin-top:0">공고 이해</h2>
    <div id="ctx" class="empty">아직 없습니다</div>
    <h2>에이전트 진행</h2>
    <div id="rail" class="empty">아직 없습니다</div>
    <h2>판정 경고</h2>
    <div id="warns" class="empty">아직 없습니다</div>
  </aside>
</div>

<script>
const SAMPLE_POSTING = `[클라우드웨이브] 백엔드 엔지니어 (경력 3년 이상)

주요 업무
- Java/Spring Boot 기반 백엔드 API 개발 및 운영
- MySQL 데이터베이스 설계 및 쿼리 최적화
- AWS 환경에서의 서비스 배포 및 운영

자격 요건
- 경력 3년 이상 (신입 불가)
- Java, Spring Boot 실무 개발 경험
- RDBMS(MySQL) 설계 및 SQL 작성 능력
- Git 기반 협업 경험

우대 사항
- 대용량 트래픽 처리 및 성능 개선 경험
- Docker, Kubernetes 등 컨테이너 환경 경험
- 정보처리기사 자격증`;

const SAMPLE_EVIDENCE = `STACK|Java|
STACK|Spring Boot|
STACK|MySQL|
STACK|Git|
PROJECT|팀 게시판 프로젝트|Spring Boot 3 + JPA 로 게시판 REST API 구현. 목록 조회 N+1 문제를 fetch join 으로 개선. 팀 4명, 2024.03~2024.06, 백엔드 담당.
EDU|한국대학교 컴퓨터공학과|학사 졸업 · 2020.03~2024.02`;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (m) =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

$('posting').value = SAMPLE_POSTING;
$('evidence').value = SAMPLE_EVIDENCE;

let ws = null, analysisId = null, curQ = null, railSeen = {};

function setConn(text, cls){
  const el = $('conn');
  el.textContent = text;
  el.className = 'tag' + (cls ? ' ' + cls : '');
}

function parseEvidence(text){
  return text.split('\n').map((l) => l.trim()).filter((l) => l && !l.startsWith('#'))
    .map((l) => {
      const p = l.split('|').map((x) => x.trim());
      return { kind: (p[0] || 'PROJECT').toUpperCase(), label: p[1] || '', description: p[2] || '' };
    }).filter((e) => e.label);
}

function start(){
  const evidences = parseEvidence($('evidence').value);
  const posting = $('posting').value;
  if(!posting.trim()){ $('note').textContent = '공고 원문을 넣어주세요.'; return; }

  analysisId = 'devui-' + Date.now();
  $('stream').innerHTML = '';
  $('report').innerHTML = '';
  $('rail').innerHTML = ''; $('rail').className = '';
  $('warns').innerHTML = ''; $('warns').className = 'empty'; $('warns').textContent = '아직 없습니다';
  $('ctx').className = 'empty'; $('ctx').textContent = '아직 없습니다';
  railSeen = {}; curQ = null;
  $('go').disabled = true;
  $('note').textContent = '분석 중입니다 — 판정에 1~3분 걸립니다.';

  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/');
  ws.onopen = () => {
    setConn('연결됨', 'live');
    ws.send(JSON.stringify({
      type: 'START', analysisId: analysisId,
      jobPosting: { company: $('company').value, role: $('role').value,
                    career: $('career').value, rawText: posting },
      evidences: evidences,
    }));
  };
  ws.onmessage = (e) => handle(JSON.parse(e.data));
  ws.onclose = () => { setConn('연결 종료'); $('reset').style.display = ''; };
  ws.onerror = () => setConn('연결 오류', 'dead');
}

function handle(m){
  if(m.type === 'PROGRESS') return onProgress(m);
  if(m.type === 'JOB_CONTEXT') return onContext(m);
  if(m.type === 'QUESTION') return onQuestion(m);
  if(m.type === 'AGENT_MESSAGE') return onSay(m);
  if(m.type === 'DONE') return onDone(m);
  if(m.type === 'ERROR') return onError(m);
}

function onProgress(m){
  const ev = document.createElement('div');
  ev.className = 'ev';
  ev.innerHTML = '<span class="pct">' + esc(m.percent) + '%</span>' +
    '<span class="who">' + esc(m.agentName || m.agent) + '</span>' +
    '<span class="what">' + esc(m.message) + '</span>';
  $('stream').appendChild(ev);
  if(!railSeen[m.agent]){
    railSeen[m.agent] = true;
    const r = document.createElement('div');
    r.className = 'warn';
    r.innerHTML = '<code>' + esc(m.agent) + '</code> — ' + esc(m.agentName);
    $('rail').appendChild(r);
  }
  window.scrollTo(0, document.body.scrollHeight);
}

function onContext(m){
  const el = $('ctx');
  el.className = '';
  el.innerHTML =
    '<div style="font-weight:700">' + esc(m.company || '(회사명 미확인)') + '</div>' +
    '<div style="color:var(--dim);font-size:13px">' + esc(m.role || '') +
      (m.career ? ' · ' + esc(m.career) : '') + '</div>' +
    '<div class="chips">' + (m.stack || []).map((s) => '<span>' + esc(s) + '</span>').join('') + '</div>';
  const c = document.createElement('div');
  c.className = 'ctx';
  c.innerHTML = '<div class="nm">공고 분석가</div>공고를 읽었어요 — ' +
    esc([m.company, m.role].filter(Boolean).join(' · ')) +
    '. 요구 기술 ' + (m.stack || []).length + '개를 확인했어요.';
  $('stream').appendChild(c);
}

function onSay(m){
  const el = document.createElement('div');
  el.className = 'say';
  el.innerHTML = '<div class="nm">' + esc(m.agentName || 'AI') + '</div>' + esc(m.text);
  $('stream').appendChild(el);
  window.scrollTo(0, document.body.scrollHeight);
}

function onQuestion(m){
  curQ = m;
  const el = document.createElement('div');
  el.className = 'qcard';
  el.innerHTML =
    '<div class="qk">' + esc(m.agentName) + ' · 확인 질문 ' + esc(m.index) + '/' + esc(m.total) + '</div>' +
    '<div class="qt">' + esc(m.text) + '</div>' +
    (m.reason ? '<div class="qw">왜 묻나: ' + esc(m.reason) + '</div>' : '') +
    (m.options && m.options.length
      ? '<div class="chips">' + m.options.map((o) => '<span data-opt>' + esc(o) + '</span>').join('') + '</div>'
      : '') +
    '<div class="row"><input placeholder="답변을 입력하세요…" style="flex:1;min-width:200px">' +
    '<button>답변 전송</button><button class="line" data-skip>모르겠어요</button></div>';
  $('stream').appendChild(el);

  const input = el.querySelector('input');
  const send = (text) => {
    if(!curQ) return;
    ws.send(JSON.stringify({ type: 'USER_MESSAGE', analysisId: analysisId,
                             text: text, replyTo: curQ.questionId }));
    el.classList.add('answered');
    el.querySelector('.row').remove();
    const mine = document.createElement('div');
    mine.className = 'mine';
    mine.textContent = '내 답변 · ' + (text || '(무응답)');
    el.appendChild(mine);
    curQ = null;
  };
  el.querySelector('button').onclick = () => send(input.value.trim());
  el.querySelector('[data-skip]').onclick = () => send('');
  input.onkeydown = (e) => { if(e.key === 'Enter') send(input.value.trim()); };
  el.querySelectorAll('[data-opt]').forEach((s) => {
    s.style.cursor = 'pointer';
    s.onclick = () => send(s.textContent);
  });
  input.focus();
  window.scrollTo(0, document.body.scrollHeight);
}

function onError(m){
  const el = document.createElement('div');
  el.className = 'err';
  el.innerHTML = '<b>오류 [' + esc(m.code) + ']</b><br>' + esc(m.message) +
    '<div class="hint" style="margin-top:6px">다음 행동: ' + esc((m.actions || []).join(', ')) + '</div>';
  $('stream').appendChild(el);
  $('go').disabled = false;
  $('note').textContent = '다시 시도할 수 있습니다.';
}

const DEC_CLS = { APPLY_NOW:'ready', APPLY_WITH_POLISH:'ready', REINFORCE_FIRST:'caution',
                  MID_TERM_TARGET:'caution', STRUCTURAL_BLOCK:'block', UNDETERMINED:'' };
const SYM = { ok:'✓', no:'✕', tri:'△' };
const EFFORT = { low:'낮음', mid:'중간', high:'높음' };

function onDone(m){
  const r = m.result || {};
  const rd = r.readiness || {}, dec = r.decision || {};
  const now = rd.now == null ? 0 : rd.now, goal = rd.goal == null ? now : rd.goal;
  const gain = Math.max(0, goal - now);

  let h = '<div class="report">';
  h += '<h2>적합도</h2><div class="gauge"><b>' + (rd.now == null ? '—' : now) +
       '</b><small>/100 · 로드맵 완주 시 ' + (rd.goal == null ? '—' : goal) + '</small></div>' +
       '<div class="track"><i style="width:' + now + '%"></i><i class="gain" style="width:' + gain + '%"></i></div>' +
       '<div class="judge">' + esc(rd.judge) + '</div>' +
       '<div class="hint">최대 격차 · ' + esc(rd.topGap || '없음') +
       (rd.topGapFix ? ' → ' + esc(rd.topGapFix) : '') + '</div>';

  if(dec.status){
    h += '<h2>목표 상태 판정</h2><div class="dec ' + (DEC_CLS[dec.status] || '') + '">' +
      '<span class="bd">' + esc(dec.label || dec.status) + '</span>' +
      '<div class="hl">' + esc(dec.headline) + '</div>' +
      '<ul>' + (dec.reasons || []).map((x) => '<li>' + esc(x) + '</li>').join('') + '</ul>' +
      ((dec.hardConstraints || []).length
        ? '<div class="hc">' + dec.hardConstraints.map((c) =>
            '<div class="r"><b>' + esc(c.requirement) + '</b><span class="hint">현재 · ' +
            esc(c.current) + '</span><span class="no">프로젝트로 대체 불가</span></div>').join('') + '</div>'
        : '') +
      (dec.nextTarget ? '<div class="hint" style="margin-top:8px">권장 첫 목표 · ' + esc(dec.nextTarget) + '</div>' : '') +
      (dec.recheckCondition ? '<div class="hint">다시 볼 때 · ' + esc(dec.recheckCondition) + '</div>' : '') +
      '</div>';
  }

  h += '<h2>요건 대조 ' + (r.gaps || []).length + '</h2>';
  h += (r.gaps || []).map((g) =>
    '<div class="g"><span class="mk ' + esc(g.mark) + '">' + (SYM[g.mark] || '·') + '</span>' +
    '<div><div class="t">' + esc(g.requirement) +
    (g.type === 'preferred' ? ' <span class="hint">(우대)</span>' : '') + '</div>' +
    '<div class="d">' + esc(g.fix || g.evidence || '') + '</div></div></div>').join('') ||
    '<div class="empty">없습니다</div>';

  h += '<h2>준비 로드맵 ' + (r.roadmap || []).length + '</h2>';
  h += (r.roadmap || []).map((s) =>
    '<div class="step ' + (s.status === 'active' ? 'active' : '') + '">' +
    '<span class="sn">' + esc(s.no) + '</span><div style="min-width:0">' +
    '<div class="st">' + esc(s.title) + '</div>' +
    '<div class="sm">' + esc(s.meta || '') + (s.state ? ' · ' + esc(s.state) : '') + '</div>' +
    (s.body ? '<div class="sm">' + esc(s.body) + '</div>' : '') +
    ((s.tags || []).length ? '<div class="tags">' + s.tags.map((t) => '<span>' + esc(t) + '</span>').join('') + '</div>' : '') +
    '</div><span class="sd">' + esc(s.delta || '') + '</span></div>').join('') ||
    '<div class="empty">없습니다</div>';

  h += '<h2>준비·지원 경로</h2>';
  h += (r.routes || []).map((rt) =>
    '<div class="rt"><div class="h"><span class="k">' + esc(rt.title) + '</span>' +
    '<span class="e">준비 부담 ' + esc(EFFORT[rt.effort] || rt.effort) + '</span>' +
    (rt.hardRisk ? '<span class="risk">⚠ 필수조건 충돌</span>' : '') + '</div>' +
    '<div class="ss">' + esc(rt.summary) + '</div>' +
    (rt.deliverable ? '<div class="hint">대표 산출물 · ' + esc(rt.deliverable) + '</div>' : '') +
    '<div class="chips">' +
      (rt.confirmed || []).map((c) => '<span class="o">✓ ' + esc(c) + '</span>').join('') +
      (rt.missing || []).map((x) => '<span class="m">＋ ' + esc(x) + '</span>').join('') +
    '</div></div>').join('') || '<div class="empty">없습니다</div>';

  const alts = r.alternatives || [];
  const sugg = ((r.trace || {}).alternativeSuggestions) || [];
  h += '<h2>대체 공고 ' + alts.length + '</h2>';
  h += alts.map((a) =>
    '<div class="rt"><div class="h"><span class="k">' + esc(a.label) + '</span>' +
    '<span class="e">' + esc(a.company) + '</span></div>' +
    '<div class="tt">' + esc(a.role) + (a.career ? ' · ' + esc(a.career) : '') + '</div>' +
    '<div class="ss">' + esc(a.reason) + '</div></div>').join('') ||
    ('<div class="empty">카드로 낼 대체 공고가 없습니다' +
      (sugg.length ? ' — 출처 공고 없는 제안 ' + sugg.length + '건은 trace 에 있습니다(RAG 미연결)' : '') +
      '</div>');

  if(r.artifact && r.artifact.title){
    h += '<h2>대표 산출물</h2><div class="rt"><div class="tt">' + esc(r.artifact.title) + '</div>' +
      '<div class="ss">' + esc(r.artifact.why || '') + '</div>' +
      (r.artifact.doneCriteria ? '<div class="hint">완료 기준 · ' + esc(r.artifact.doneCriteria) + '</div>' : '') +
      '</div>';
  }

  h += '<details><summary>DONE.result 원본 JSON (웹 DB에 저장되는 그 값)</summary><pre>' +
       esc(JSON.stringify(r, null, 2)) + '</pre></details>';
  h += '</div>';
  $('report').innerHTML = h;

  const warns = ((r.trace || {}).warnings) || [];
  const wEl = $('warns');
  if(warns.length){
    wEl.className = '';
    wEl.innerHTML = warns.map((w) =>
      '<div class="warn"><code>' + esc((w.node || '') + '/' + (w.code || '')) + '</code><br>' +
      esc(w.message) + '</div>').join('');
  }

  $('go').disabled = false;
  $('reset').style.display = '';
  $('note').textContent = '완료했습니다. 코드를 고치고 다시 눌러 보세요 (--reload 로 띄우면 자동 반영).';
  window.scrollTo(0, document.body.scrollHeight);
}

$('go').onclick = start;
$('reset').onclick = () => { $('stream').innerHTML = ''; $('report').innerHTML = ''; setConn('대기'); };
</script>
</body>
</html>
