<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>JOBIS 차별점 비교표</title>
<style>
  :root{
    --paper:#2b8fd6;
    --card:#ffffff;
    --head:#ededed;
    --line:#e4e4e4;
    --ink:#1f1f1f;
    --sub:#6b6b6b;
    --o:#1a8f4c;
    --x:#c24a4a;
    --hl:#eef6fd;
    --sky:#2b8fd6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    font-family:"Pretendard","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:56px 40px;
  }
  .wrap{width:100%;max-width:1180px;}
  .board{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.06);
  }
  table{width:100%;border-collapse:collapse;table-layout:fixed;}
  th,td{
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
    padding:22px 14px;
    text-align:center;
    vertical-align:middle;
  }
  th:last-child,td:last-child{border-right:none;}
  tbody tr:last-child td{border-bottom:none;}

  /* header row */
  thead th{
    background:var(--head);
    font-size:19px;
    font-weight:800;
    color:#2a2a2a;
    line-height:1.35;
    letter-spacing:-.02em;
  }
  thead th.corner{background:var(--head);}

  /* row label column */
  .rowlabel{
    font-size:22px;
    font-weight:800;
    letter-spacing:-.02em;
    background:#fff;
    width:190px;
  }
  .rowlabel .small{display:block;font-size:12.5px;font-weight:600;color:var(--sub);margin-top:5px;letter-spacing:0;}

  /* cells */
  .mark{font-size:30px;font-weight:800;line-height:1;}
  .o{color:var(--o);}
  .x{color:var(--x);}

  /* jobis highlight row */
  tr.jobis td{background:var(--hl);}
  tr.jobis .rowlabel{background:var(--hl);color:#111;}
  tr.jobis .rowlabel .brand{color:var(--sky);}

  caption{
    caption-side:top;
    text-align:left;
    padding:0 4px 18px;
  }
  caption .t{font-size:26px;font-weight:800;letter-spacing:-.02em;color:#fff;}
  caption .s{display:block;font-size:14px;font-weight:600;color:rgba(255,255,255,.9);margin-top:7px;letter-spacing:-.01em;}

  .foot{
    margin-top:20px;
    padding:16px 20px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:12px;
    font-size:14.5px;
    color:#333;
    line-height:1.6;
  }
  .foot b{color:#c98a1a;}
</style>
</head>
<body>
  <div class="wrap">
    <table class="board" role="table">
      <caption>
        <span class="t">취업 플랫폼도, 범용 챗봇도 못 하는 지점</span>
        <span class="s">경로를 설계하고, 데이터로 일관성을 보장한다</span>
      </caption>
      <thead>
        <tr>
          <th class="corner"></th>
          <th>실제 채용 공고<br>데이터 기반</th>
          <th>이력서 × 공고 맞춤 적합도 진단</th>
          <th>대체 · 우회<br>경로 설계</th>
          <th>도메인별 포트폴리오 틀<br><span style="font-weight:600;font-size:13px;color:#666;">(IT는 스켈레톤 코드)</span></th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="rowlabel">범용 LLM<span class="small">챗봇 · 생성 AI</span></td>
          <td><span class="mark x">X</span></td>
          <td><span class="mark x">X</span></td>
          <td><span class="mark x">X</span></td>
          <td><span class="mark x">X</span></td>
        </tr>
        <tr>
          <td class="rowlabel">취업 플랫폼<span class="small">공고 나열 · 검색</span></td>
          <td><span class="mark o">O</span></td>
          <td><span class="mark x">X</span></td>
          <td><span class="mark x">X</span></td>
          <td><span class="mark x">X</span></td>
        </tr>
        <tr class="jobis">
          <td class="rowlabel"><span class="brand">JOBIS</span></td>
          <td><span class="mark o">O</span></td>
          <td><span class="mark o">O</span></td>
          <td><span class="mark o">O</span></td>
          <td><span class="mark o">O</span></td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
