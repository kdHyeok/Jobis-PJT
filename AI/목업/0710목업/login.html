<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>잡퀘스트 — 회원 등록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="app.js" defer></script>
</head>
<body>
<div class="authwrap">

  <a class="logo" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4"/><path d="M5 5h12l-2.6 4L17 13H5"/></svg>
    잡퀘스트
  </a>

  <!-- 등록 원서 -->
  <div class="auth-doc">
    <span class="stamp stamp-pos">회원 등록</span>
    <h1>잡퀘스트 시작하기</h1>
    <p class="muted mt4" style="font-size:13px">3분이면 첫 준비 경로가 생깁니다.</p>

    <div class="auth-tabs" role="tablist"><span>로그인</span><span class="on">회원가입</span></div>

    <form onsubmit="return false">
      <div class="field"><label for="f-name">이름</label><input id="f-name" class="inp" value="박준영" readonly></div>
      <div class="field"><label for="f-mail">이메일</label><input id="f-mail" class="inp" value="junyoung.park@gmail.com" readonly></div>
      <div class="field"><label for="f-pw">비밀번호</label><input id="f-pw" class="inp" type="password" value="password123" readonly></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="field"><label for="f-job">관심 직무</label>
          <select id="f-job" class="inp"><option>백엔드 개발</option><option>프론트엔드 개발</option><option>데이터 분석</option></select>
        </div>
        <div class="field"><label for="f-status">현재 상태</label>
          <select id="f-status" class="inp"><option>취업 준비생</option><option>재직 중</option><option>재학 중</option></select>
        </div>
      </div>
      <div class="auth-meta">
        <label style="display:flex;gap:7px;align-items:center;cursor:pointer">
          <input type="checkbox" checked style="accent-color:var(--red-deep)"> 이용약관 · 개인정보 처리방침 동의
        </label>
        <a class="txt-link" href="#">자세히</a>
      </div>
      <a class="btn btn-pri btn-lg btn-full" href="new.html">가입하고 경로 만들기</a>
    </form>

    <div class="divider">또는</div>
    <div class="social">
      <a class="btn btn-line" href="new.html">Google로 계속</a>
      <a class="btn btn-kakao" href="new.html">카카오로 계속</a>
    </div>
    <p class="small mt16" style="text-align:center">이미 계정이 있으신가요? <a class="txt-link" href="#">로그인</a></p>
  </div>

  <p class="auth-below">
    <svg class="i-sm i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="1"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    업로드한 문서는 분석에만 사용하며 언제든 삭제할 수 있습니다.
  </p>
</div>

<nav class="flow-nav" aria-label="프로토타입 흐름">
  <span class="lbl">흐름 2/10 · 회원가입</span>
  <a href="index.html">← 랜딩</a>
  <a class="next" href="new.html">새 분석 →</a>
</nav>
</body>
</html>
