# JOBIS GitLab CI/CD
#
# 파이프라인 정책
#   - MR, develop, master 에서 CI(테스트·패키징) 실행
#   - master 에 push(병합)되면 CI 통과 후 운영 서버에 자동 배포
#   - develop 은 CI까지만 실행 (배포 없음)
#
# 배포에 필요한 CI/CD 변수(Settings → CI/CD → Variables, 전부 Protected):
#   DEPLOY_HOST         배포 서버 주소
#   DEPLOY_USER         배포 전용 SSH 사용자 (예: jobis-deploy)
#   DEPLOY_SSH_KEY      배포 전용 SSH 개인키 (Type: File)
#   DEPLOY_KNOWN_HOSTS  ssh-keyscan 결과 (Type: File)
# 서버 사전 설정은 ops/CICD_SETUP.md 참고.

stages:
  - test
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "master"'

# ── CI: 백엔드 테스트 + 실행 JAR 패키징 ──────────────────────────
backend-test:
  stage: test
  image: eclipse-temurin:17-jdk
  timeout: 20m
  services:
    - name: mysql:8.0
      alias: mysql
  variables:
    MYSQL_DATABASE: jobiss
    MYSQL_USER: jobis_ci
    MYSQL_PASSWORD: ci-only-password
    MYSQL_ROOT_PASSWORD: ci-only-root-password
    DB_URL: "jdbc:mysql://mysql:3306/jobiss?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
    DB_USERNAME: jobis_ci
    DB_PASSWORD: ci-only-password
    JWT_SECRET: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  cache:
    key: gradle
    paths:
      - .gradle/caches
      - .gradle/wrapper
  script:
    - cd backend
    - chmod +x gradlew
    - ./gradlew clean test bootJar --no-daemon
    # 실행 가능한 JAR만 backend.jar로 고정 (plain JAR 제외)
    - |
      backend_jar="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' -print -quit)"
      if [ -z "$backend_jar" ]; then echo "실행 가능한 Spring Boot JAR가 없습니다."; exit 1; fi
      cp "$backend_jar" backend.jar
  artifacts:
    paths:
      - backend/backend.jar
    reports:
      junit: backend/build/test-results/test/*.xml
    expire_in: 1 week

# ── CI: fake-ai 검증 + 스모크 테스트 + 배포 패키징 ───────────────
fake-ai-test:
  stage: test
  image: node:24
  timeout: 10m
  cache:
    key: npm
    paths:
      - fake-ai/.npm
  script:
    - cd fake-ai
    - npm ci --omit=dev --ignore-scripts --cache .npm
    - node --check server.js
    # 스모크 테스트: 서버를 띄우고 /extract가 응답하는지 확인
    - |
      node server.js > /tmp/fake-ai.log 2>&1 &
      fake_ai_pid=$!
      ready=false
      for _ in $(seq 1 20); do
        if curl -fsS -X POST -H 'Content-Type: application/json' \
          -d '{"sourceType":"TEXT","content":"Java Spring Boot MySQL"}' \
          http://127.0.0.1:8000/extract >/dev/null 2>&1; then
          ready=true; break
        fi
        sleep 1
      done
      kill "$fake_ai_pid" 2>/dev/null || true
      if [ "$ready" != true ]; then cat /tmp/fake-ai.log; exit 1; fi
    # 배포용 아카이브 생성 (node_modules 포함)
    - tar -czf fake-ai.tar.gz package.json package-lock.json server.js result.json node_modules
  artifacts:
    paths:
      - fake-ai/fake-ai.tar.gz
    expire_in: 1 week

# ── CD: master 병합 시 운영 서버 자동 배포 ───────────────────────
deploy-production:
  stage: deploy
  image: alpine:3.20
  timeout: 10m
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  needs:
    - backend-test
    - fake-ai-test
  environment:
    name: production
  resource_group: production   # 동시 배포 방지
  before_script:
    - apk add --no-cache openssh-client
    - test -n "$DEPLOY_HOST" || { echo "DEPLOY_HOST 변수가 없습니다."; exit 1; }
    - test -n "$DEPLOY_USER" || { echo "DEPLOY_USER 변수가 없습니다."; exit 1; }
    - test -f "$DEPLOY_SSH_KEY" || { echo "DEPLOY_SSH_KEY(File) 변수가 없습니다."; exit 1; }
    - test -f "$DEPLOY_KNOWN_HOSTS" || { echo "DEPLOY_KNOWN_HOSTS(File) 변수가 없습니다."; exit 1; }
    - chmod 600 "$DEPLOY_SSH_KEY"
  script:
    # 릴리스 업로드
    - >
      scp -i "$DEPLOY_SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=yes
      -o UserKnownHostsFile="$DEPLOY_KNOWN_HOSTS"
      backend/backend.jar
      "$DEPLOY_USER@$DEPLOY_HOST:/tmp/jobis-backend-$CI_COMMIT_SHA.jar"
    - >
      scp -i "$DEPLOY_SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=yes
      -o UserKnownHostsFile="$DEPLOY_KNOWN_HOSTS"
      fake-ai/fake-ai.tar.gz
      "$DEPLOY_USER@$DEPLOY_HOST:/tmp/jobis-fake-ai-$CI_COMMIT_SHA.tar.gz"
    # 릴리스 활성화 (실패 시 서버 스크립트가 자동 롤백)
    - >
      ssh -i "$DEPLOY_SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=yes
      -o UserKnownHostsFile="$DEPLOY_KNOWN_HOSTS"
      "$DEPLOY_USER@$DEPLOY_HOST"
      "sudo -n /usr/local/sbin/deploy-jobis '$CI_COMMIT_SHA'"
