<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.O.B.I.S — 새 분석</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="styles.css">
<script src="theme.js"></script>
<script src="auth.js"></script>
<script src="live-run.js"></script>
</head>
<body>
<button class="theme-tg fixed" id="themeTg" type="button" aria-pressed="false" aria-label="라이트/다크 모드 전환"><i class="i i-sun"></i><i class="i i-moon"></i></button>

<div class="setup-top">
  <div class="brand">
    <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 5h12l-2.6 4L17 13H5"/></svg></span>
    <span class="nm">J.O.B.<span>I.S</span></span>
  </div>
  <button class="ghost-btn" onclick="location.href='home.html'">← 홈</button>
  <span class="sp"></span>
  <div class="u"><span class="av" id="uAv">?</span><span class="u-name" id="uName">…</span></div>
  <button class="ghost-btn" id="logoutBtn">로그아웃</button>
</div>

<div class="setup-wrap">
  <h1 class="setup-h">새 분석 시작</h1>
  <p class="setup-sub">목표 공고와 내 자료를 넣으면, AI가 공고를 읽고 내 자료와 대조해 실시간으로 준비도를 진단해요.</p>

  <p id="setupErr" class="auth-err" style="display:none"></p>

  <!-- STEP 1: 공고 입력(원문 그대로 전달, 분석은 AI가) -->
  <div class="setup-step">
    <div class="st-h">
      <span class="st-n">1</span>
      <span class="st-t">목표 공고</span>
    </div>
    <div class="method-tabs">
      <button data-m="URL" class="on"><i class="i i-link"></i> URL</button>
      <button data-m="TEXT"><i class="i i-note"></i> 원문 붙여넣기</button>
      <button data-m="FILE"><i class="i i-clip"></i> 파일</button>
    </div>
    <input id="inUrl" class="job-input" placeholder="https://careers.example.com/jobs/backend" aria-label="공고 URL">
    <textarea id="inText" class="job-input" style="display:none" placeholder="채용공고 원문을 붙여넣으세요. 예) 클라우드웨이브 · 백엔드 엔지니어(Java/Spring) · 3년↑ · Java, Spring Boot, MySQL, AWS 필수 · Kafka 우대"></textarea>
    <input id="inFile" class="job-input" style="display:none" type="file" accept=".txt,.md,.html,.htm" aria-label="공고 파일">
    <div class="job-parse-actions">
      <span class="hint"><i class="i i-chip"></i> 공고는 분석을 시작하면 AI가 읽고 회사·직무·요구 기술로 정리해줘요.</span>
    </div>
  </div>

  <!-- STEP 2: 자료 -->
  <div class="setup-step">
    <div class="st-h">
      <span class="st-n">2</span>
      <span class="st-t">분석에 쓸 자료 선택</span>
      <button class="sel-all" id="selAll" style="margin-left:auto">전체 선택</button>
    </div>
    <div class="ev-list" id="evList"></div>
  </div>
</div>

<div class="setup-bar">
  <div class="info" id="barInfo">공고와 자료를 넣어주세요</div>
  <span class="sp"></span>
  <button class="start-btn" id="startBtn" disabled>분석 시작 →</button>
</div>

<script>
(function(){
  if (!JB.requireAuth()) return;

  var KIND = { PROJECT:'프로젝트', GITHUB:'깃허브', PORTFOLIO:'포트폴리오', STACK:'스택', EDU:'교육', CERT:'자격' };
  var method = 'URL';
  var evidences = [];
  var selected = new Set();

  var errEl = document.getElementById('setupErr');
  function showErr(m){ errEl.textContent=m; errEl.style.display=''; }
  function clearErr(){ errEl.style.display='none'; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  // 사용자
  var u = JB.user() || {};
  document.getElementById('uName').textContent = u.name || '사용자';
  document.getElementById('uAv').textContent = (u.name || '?').slice(0,1);
  document.getElementById('logoutBtn').addEventListener('click', function(){ JB.logout(); location.href='login.html'; });

  // 입력 방식 탭
  function setMethod(m){
    method = m;
    document.querySelectorAll('.method-tabs button').forEach(function(x){ x.classList.toggle('on', x.dataset.m===m); });
    document.getElementById('inUrl').style.display  = m==='URL' ? '' : 'none';
    document.getElementById('inText').style.display = m==='TEXT' ? '' : 'none';
    document.getElementById('inFile').style.display = m==='FILE' ? '' : 'none';
    refresh();
  }
  document.querySelectorAll('.method-tabs button').forEach(function(b){
    b.addEventListener('click', function(){ setMethod(b.dataset.m); });
  });
  document.getElementById('inUrl').addEventListener('input', refresh);
  document.getElementById('inText').addEventListener('input', refresh);
  document.getElementById('inFile').addEventListener('change', refresh);

  // 홈 빠른입력창에서 넘어온 값 프리필
  try {
    var quick = sessionStorage.getItem('jobis.quickJob');
    if (quick) {
      sessionStorage.removeItem('jobis.quickJob');
      if (/^https?:\/\//i.test(quick)) { setMethod('URL'); document.getElementById('inUrl').value = quick; }
      else { setMethod('TEXT'); document.getElementById('inText').value = quick; }
    }
  } catch(_){}

  function hasJobInput(){
    if (method === 'URL')  return document.getElementById('inUrl').value.trim().length>0;
    if (method === 'TEXT') return document.getElementById('inText').value.trim().length>0;
    return document.getElementById('inFile').files.length>0;
  }
  function collectContent(){
    if (method === 'URL')  return Promise.resolve(document.getElementById('inUrl').value.trim());
    if (method === 'TEXT') return Promise.resolve(document.getElementById('inText').value.trim());
    var f = document.getElementById('inFile').files[0];
    return f ? f.text() : Promise.resolve('');
  }

  // ── STEP 2: 자료 로드 ──
  JB.api('/api/evidences').then(function(list){
    evidences = list || [];
    var box = document.getElementById('evList');
    if (!evidences.length){
      box.innerHTML = '<div class="ev-empty">저장된 자료가 없어요. <a href="storage.html" style="color:var(--brand);font-weight:700">커리어 저장소</a>에서 먼저 자료를 채워주세요.</div>';
      document.getElementById('selAll').style.display='none';
      return;
    }
    box.innerHTML = evidences.map(function(e){
      return '<button class="ev-row" data-id="'+e.id+'">'
           +   '<span class="ev-box">✓</span>'
           +   '<span class="ev-kind">'+esc(KIND[e.kind]||e.kind)+'</span>'
           +   '<span class="ev-bd"><div class="ev-t">'+esc(e.label)+'</div>'
           +     (e.description ? '<div class="ev-d">'+esc(e.description)+'</div>' : '')
           +   '</span>'
           + '</button>';
    }).join('');
    box.querySelectorAll('.ev-row').forEach(function(row){
      row.addEventListener('click', function(){
        var id = Number(row.dataset.id);
        if (selected.has(id)) { selected.delete(id); row.classList.remove('sel'); }
        else { selected.add(id); row.classList.add('sel'); }
        refresh();
      });
    });
    // 기본 전체 선택
    evidences.forEach(function(e){ selected.add(e.id); });
    box.querySelectorAll('.ev-row').forEach(function(row){ row.classList.add('sel'); });
    refresh();
  }).catch(function(err){
    document.getElementById('evList').innerHTML = '<div class="ev-empty">자료를 불러오지 못했어요: '+esc(err.message)+'</div>';
  });

  // 전체 선택/해제 (라벨은 refresh가 상태에 맞춰 동기화 — #7)
  document.getElementById('selAll').addEventListener('click', function(){
    var allSel = selected.size === evidences.length && evidences.length>0;
    selected.clear();
    document.querySelectorAll('.ev-row').forEach(function(row){
      if (allSel){ row.classList.remove('sel'); }
      else { row.classList.add('sel'); selected.add(Number(row.dataset.id)); }
    });
    refresh();
  });

  function refresh(){
    var jobOk = hasJobInput();
    var ready = jobOk && selected.size>0;
    document.getElementById('startBtn').disabled = !ready;
    var info = document.getElementById('barInfo');
    if (!jobOk) info.innerHTML = '공고를 입력하세요';
    else if (selected.size===0) info.innerHTML = '자료를 1개 이상 선택하세요';
    else info.innerHTML = '자료 <b>'+selected.size+'</b>건으로 분석 준비 완료';
    var sa = document.getElementById('selAll');
    if (sa) sa.textContent = (selected.size === evidences.length && evidences.length>0) ? '전체 해제' : '전체 선택';
  }
  refresh();

  // ── 분석 시작 ── 공고 원문을 그대로 전달(파싱은 AI가)
  document.getElementById('startBtn').addEventListener('click', async function(){
    clearErr();
    var content = await collectContent();
    if (!content) { showErr('공고 URL이나 원문을 입력하세요.'); return; }
    if (selected.size===0) { showErr('자료를 1개 이상 선택하세요.'); return; }
    var btn = this; btn.disabled = true; btn.textContent = '세션 여는 중…';
    try {
      var res = await JB.api('/api/analyses/agent-custom', {
        method:'POST',
        body: JSON.stringify({ sourceType: method, content: content, evidenceIds: Array.from(selected) })
      });
      var selEv = evidences.filter(function(e){ return selected.has(e.id); })
                    .map(function(e){ return { kind:e.kind, label:e.label }; });
      try { sessionStorage.setItem('jobis.analysisMeta', JSON.stringify({ id: res.analysisId, evidences: selEv })); } catch(_){}
      location.href = 'chat.html?id=' + encodeURIComponent(res.analysisId);
    } catch(err){
      showErr('분석을 시작하지 못했어요: ' + err.message);
      btn.disabled = false; btn.textContent = '분석 시작 →';
    }
  });
})();
</script>
</body>
</html>
