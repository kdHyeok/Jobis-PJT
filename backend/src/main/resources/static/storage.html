<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.O.B.I.S — 커리어 저장소</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="styles.css">
<script src="theme.js"></script>
<script src="auth.js"></script>
<script src="live-run.js"></script>
</head>
<body>
<button class="theme-tg fixed" id="themeTg" type="button" aria-pressed="false" aria-label="라이트/다크 모드 전환"><i class="i i-sun"></i><i class="i i-moon"></i></button>
<div class="app stg">
  <!-- ============ 사이드바 ============ -->
  <aside class="sidebar">
    <div class="brand">
      <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 5h12l-2.6 4L17 13H5"/></svg></span>
      <span class="nm">J.O.B.<span>I.S</span></span>
    </div>
    <button class="new-btn" onclick="location.href='new.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      새 분석 시작
    </button>
    <div class="side-scroll">
      <a class="side-nav" onclick="location.href='home.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>
        홈
      </a>
      <a class="side-nav" style="background:var(--brand-soft);color:var(--brand-ink);font-weight:700">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        커리어 저장소
      </a>
      <a class="side-nav" onclick="location.href='roadmaps.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg>
        로드맵 저장소
      </a>
      <div class="side-card" style="margin-top:14px">
        <h4>저장소 요약</h4>
        <div id="sideSummary" style="font-size:12.5px;color:var(--ink-2)">불러오는 중…</div>
      </div>
    </div>
    <div class="userchip">
      <div class="av" id="sideAv">?</div>
      <div><div class="u-name" id="sideName">사용자</div><div class="u-mail" id="sideMail"></div></div>
      <button class="more" id="logoutBtn" title="로그아웃" style="background:none;border:0;font-size:16px;color:var(--faint)">⎋</button>
    </div>
  </aside>

  <!-- ============ 메인 ============ -->
  <main class="stg-main">
    <div class="stg-scroll">
      <div class="stg-inner">
        <h1 class="stg-h">커리어 저장소</h1>
        <p class="stg-sub">이력서 본문·GitHub·프로젝트를 올리면 AI가 <b>스킬·경험 조각</b>으로 정리해요. 스택은 중복 없이 하나씩 모입니다.</p>

        <!-- 자료 추가 -->
        <div class="stg-card">
          <div class="sc-h"><span>＋ 자료 올리기</span></div>
          <div class="method-tabs">
            <button data-m="TEXT" class="on"><i class="i i-note"></i> 텍스트 붙여넣기</button>
            <button data-m="GITHUB"><i class="i i-link"></i> GitHub URL</button>
            <button data-m="FILE"><i class="i i-clip"></i> 파일</button>
          </div>
          <textarea id="inText" class="stg-input" placeholder="이력서·자기소개서 본문을 붙여넣으세요. 예) 클라우드 모니터링 대시보드 프로젝트 — Java, Spring Boot, MySQL로 개발. 목록 API 응답을 1.2s→180ms로 개선…"></textarea>
          <input id="inUrl" class="stg-input" style="display:none" placeholder="https://github.com/사용자명/저장소" aria-label="GitHub URL">
          <input id="inFile" class="stg-input" style="display:none" type="file" accept=".txt,.md,.html,.htm,.json,.csv" aria-label="파일 선택">
          <div class="stg-actions">
            <button class="ai-btn" id="parseBtn">✦ AI로 정리하기</button>
            <span class="hint" id="parseHint">붙여넣은 내용을 AI가 읽고 조각으로 나눠줘요</span>
          </div>
        </div>

        <!-- AI가 찾은 조각(파싱 결과) -->
        <div class="stg-card" id="proposalCard" style="display:none">
          <div class="sc-h"><span>✦ AI가 찾은 조각</span><span class="n" id="propCount"></span></div>
          <div style="display:flex;gap:10px;margin-bottom:12px">
            <button class="tbtn" id="selAllBtn" style="border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--ink-2)">전체 선택</button>
          </div>
          <div id="proposals"></div>
          <div class="stg-actions" style="margin-top:14px">
            <button class="ai-btn" id="saveBtn">저장소에 등록</button>
            <span class="hint" id="saveHint"></span>
          </div>
        </div>

        <!-- 내 저장소 현황 -->
        <div class="stg-card">
          <div class="sc-h"><span><i class="i i-folder"></i> 내 저장소</span><span class="n" id="storeCount"></span></div>
          <div id="storeBody"><div class="store-empty">불러오는 중…</div></div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  if (!JB.requireAuth()) return;

  var KIND_LABEL = { STACK:'스택', PROJECT:'프로젝트', GITHUB:'GitHub', CERT:'자격', EDU:'교육', PORTFOLIO:'포트폴리오' };
  var KIND_ORDER = ['STACK','PROJECT','GITHUB','CERT','EDU','PORTFOLIO'];
  var method = 'TEXT';
  var proposals = [];   // {kind,label,description,duplicate, selected}

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on'); setTimeout(function(){ t.classList.remove('on'); }, 2600); }

  // 사용자
  var u = JB.user() || {};
  document.getElementById('sideAv').textContent = (u.name||'?').slice(0,1);
  document.getElementById('sideName').textContent = u.name || '사용자';
  document.getElementById('sideMail').textContent = u.email || '';
  document.getElementById('logoutBtn').addEventListener('click', function(){ JB.logout(); location.href='login.html'; });

  // 입력 방식 탭
  document.querySelectorAll('.method-tabs button').forEach(function(b){
    b.addEventListener('click', function(){
      method = b.dataset.m;
      document.querySelectorAll('.method-tabs button').forEach(function(x){ x.classList.toggle('on', x===b); });
      document.getElementById('inText').style.display = method==='TEXT' ? '' : 'none';
      document.getElementById('inUrl').style.display  = method==='GITHUB' ? '' : 'none';
      document.getElementById('inFile').style.display = method==='FILE' ? '' : 'none';
      document.getElementById('parseHint').textContent = method==='GITHUB'
        ? 'GitHub 저장소 주소를 넣으면 프로젝트로 정리해요'
        : (method==='FILE' ? '.txt·.md·.html 파일을 텍스트로 읽어 정리해요' : '붙여넣은 내용을 AI가 읽고 조각으로 나눠줘요');
    });
  });

  // 입력 내용 모으기(파일은 비동기)
  function collectContent(){
    if (method === 'TEXT')  return Promise.resolve(document.getElementById('inText').value.trim());
    if (method === 'GITHUB') return Promise.resolve(document.getElementById('inUrl').value.trim());
    var f = document.getElementById('inFile').files[0];
    if (!f) return Promise.resolve('');
    return f.text();   // 텍스트 파일만 지원(모형)
  }

  // ── AI로 정리하기(파싱) ──
  document.getElementById('parseBtn').addEventListener('click', async function(){
    var btn = this;
    var content = await collectContent();
    if (!content) { toast('내용을 입력하거나 파일을 선택하세요'); return; }
    btn.disabled = true; btn.textContent = 'AI가 읽는 중…';
    try {
      var res = await JB.api('/api/evidences/parse', {
        method:'POST', body: JSON.stringify({ sourceType: method, content: content })
      });
      proposals = (res.fragments || []).map(function(f){ return Object.assign({}, f, { selected: !f.duplicate }); });
      renderProposals();
      if (!proposals.length) toast('조각을 찾지 못했어요. 내용을 더 자세히 적어보세요');
    } catch(err){ toast('정리 실패: ' + err.message); }
    finally { btn.disabled = false; btn.textContent = '✦ AI로 정리하기'; }
  });

  function renderProposals(){
    var card = document.getElementById('proposalCard');
    if (!proposals.length){ card.style.display='none'; return; }
    card.style.display = '';
    document.getElementById('propCount').textContent = proposals.length + '개 발견';

    var host = document.getElementById('proposals');
    host.innerHTML = '';
    KIND_ORDER.forEach(function(kind){
      var items = proposals.filter(function(p){ return p.kind===kind; });
      if (!items.length) return;
      var group = document.createElement('div');
      group.className = 'frag-group';
      group.innerHTML = '<div class="fg-h">'+esc(KIND_LABEL[kind]||kind)+' <span class="fg-n">'+items.length+'</span></div>';
      items.forEach(function(p){
        var idx = proposals.indexOf(p);
        var row = document.createElement('div');
        row.className = 'frag' + (p.duplicate ? ' dup' : (p.selected ? ' sel' : ''));
        row.innerHTML =
          '<span class="fbox">✓</span>' +
          '<span class="fk">'+esc(KIND_LABEL[p.kind]||p.kind)+'</span>' +
          '<span class="fbd"><span class="flabel" '+(p.duplicate?'':'contenteditable="true"')+' data-i="'+idx+'">'+esc(p.label)+'</span>' +
            '<div class="fdesc">'+esc(p.description||'')+'</div></span>' +
          (p.duplicate ? '<span class="fdup">이미 있음</span>' : '');
        if (!p.duplicate){
          row.addEventListener('click', function(e){
            if (e.target.classList.contains('flabel')) return;   // 라벨 편집 중엔 토글 안 함
            p.selected = !p.selected;
            row.classList.toggle('sel', p.selected);
          });
          row.querySelector('.flabel').addEventListener('input', function(){ p.label = this.textContent.trim(); updateSaveHint(); });
        }
        group.appendChild(row);
      });
      host.appendChild(group);
    });
    updateSaveHint();
  }

  function updateSaveHint(){
    var selectable = proposals.filter(function(p){ return !p.duplicate; });
    // 라벨을 비운 조각은 저장 대상에서 제외되므로 카운트에서도 뺀다(#8: 버튼 수치=실제 저장 수 일치)
    var n = proposals.filter(function(p){ return p.selected && !p.duplicate && p.label; }).length;
    var dup = proposals.filter(function(p){ return p.duplicate; }).length;
    document.getElementById('saveHint').textContent =
      n + '개 등록' + (dup ? ' · 중복 ' + dup + '개 제외' : '');
    var sb = document.getElementById('saveBtn');
    sb.textContent = '저장소에 등록' + (n ? ' (' + n + '개)' : '');
    sb.disabled = n === 0;
    sb.style.opacity = n === 0 ? .6 : 1;
    // 전체 선택 버튼 라벨을 현재 상태와 동기화(#6: 첫 클릭이 해제로 뒤집히던 문제)
    var allSel = selectable.length>0 && selectable.every(function(p){ return p.selected; });
    document.getElementById('selAllBtn').textContent = allSel ? '전체 해제' : '전체 선택';
  }
  // 선택 상태 바뀔 때 힌트 갱신(위임)
  document.getElementById('proposals').addEventListener('click', updateSaveHint);

  // 전체 선택/해제
  document.getElementById('selAllBtn').addEventListener('click', function(){
    var selectable = proposals.filter(function(p){ return !p.duplicate; });
    var allSel = selectable.length>0 && selectable.every(function(p){ return p.selected; });
    selectable.forEach(function(p){ p.selected = !allSel; });
    this.textContent = allSel ? '전체 선택' : '전체 해제';
    renderProposals();
  });

  // ── 저장소에 등록 ──
  document.getElementById('saveBtn').addEventListener('click', async function(){
    var items = proposals.filter(function(p){ return p.selected && !p.duplicate && p.label; })
                         .map(function(p){ return { kind:p.kind, label:p.label, description:p.description }; });
    if (!items.length) return;
    var btn = this; btn.disabled = true; btn.textContent = '등록 중…';
    try {
      var res = await JB.api('/api/evidences/import', { method:'POST', body: JSON.stringify({ items: items }) });
      var made = (res.created||[]).length;
      toast(made + '개 조각을 저장소에 등록했어요' + (res.skipped ? ' (중복 ' + res.skipped + '개 제외)' : ''));
      proposals = [];
      document.getElementById('proposalCard').style.display = 'none';
      document.getElementById('inText').value = '';
      loadStore();
    } catch(err){ toast('등록 실패: ' + err.message); btn.disabled=false; updateSaveHint(); }
  });

  // ── 내 저장소 현황 ──
  function loadStore(){
    JB.api('/api/evidences').then(function(list){
      list = list || [];
      document.getElementById('storeCount').textContent = list.length + '개';
      // 사이드 요약
      var byKind = {};
      list.forEach(function(e){ byKind[e.kind] = (byKind[e.kind]||0)+1; });
      document.getElementById('sideSummary').innerHTML = list.length
        ? KIND_ORDER.filter(function(k){ return byKind[k]; })
            .map(function(k){ return esc(KIND_LABEL[k]) + ' <b>' + byKind[k] + '</b>'; }).join(' · ')
        : '아직 비어 있어요';

      var body = document.getElementById('storeBody');
      if (!list.length){ body.innerHTML = '<div class="store-empty">아직 저장된 자료가 없어요.<br>위에서 이력서나 GitHub를 올려보세요.</div>'; return; }
      body.innerHTML = '';
      KIND_ORDER.forEach(function(kind){
        var items = list.filter(function(e){ return e.kind===kind; });
        if (!items.length) return;
        var sub = document.createElement('div'); sub.className='store-sub'; sub.textContent = KIND_LABEL[kind] + ' (' + items.length + ')';
        body.appendChild(sub);
        if (kind === 'STACK'){
          var grid = document.createElement('div'); grid.className='store-grid';
          grid.innerHTML = items.map(function(e){ return '<span class="store-stk">'+esc(e.label)+'</span>'; }).join('');
          body.appendChild(grid);
        } else {
          items.forEach(function(e){
            var row = document.createElement('div'); row.className='store-row';
            row.innerHTML = '<span class="rk">'+esc(KIND_LABEL[kind])+'</span><span class="rt">'+esc(e.label)+'</span>'+
              (e.description ? '<span class="rd">'+esc(e.description)+'</span>' : '');
            body.appendChild(row);
          });
        }
      });
    }).catch(function(err){ document.getElementById('storeBody').innerHTML = '<div class="store-empty">불러오기 실패: '+esc(err.message)+'</div>'; });
  }

  loadStore();
})();
</script>
</body>
</html>
