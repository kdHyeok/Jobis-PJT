<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>요청을 처리할 수 없어요 · J.O.B.I.S</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<!-- 오류 페이지는 임의의 경로에서 렌더되므로 링크·리소스는 반드시 절대경로 -->
<link rel="stylesheet" href="/styles.css">
<script src="/theme.js"></script>
<style>
.err-wrap{min-height:100vh;display:grid;place-items:center;padding:32px 20px}
.err-card{width:100%;max-width:440px;text-align:center}
.err-brand{display:inline-flex;align-items:center;gap:9px;margin-bottom:32px;color:var(--ink)}
.err-brand .lg{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));color:var(--on-brand);flex:0 0 auto}
.err-brand .lg svg{width:17px;height:17px}
.err-brand .nm{font-weight:800;font-size:16px;letter-spacing:-.02em}
.err-brand .nm span{color:var(--brand)}
.err-pill{display:inline-block;font-size:11.5px;font-weight:800;border-radius:20px;padding:4px 12px;
  background:var(--warn-soft);color:var(--warn)}
.err-t{font-size:21px;font-weight:800;letter-spacing:-.02em;margin:14px 0 7px;color:var(--ink)}
.err-s{font-size:13.5px;color:var(--muted);line-height:1.65;margin:0}
.err-acts{display:flex;gap:9px;justify-content:center;margin-top:28px;flex-wrap:wrap}
.err-btn{display:inline-block;border-radius:10px;padding:11px 18px;font-size:13.5px;font-weight:700;
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  box-shadow:var(--shadow-sm);cursor:pointer;text-decoration:none}
.err-btn:hover{background:var(--line-2);color:var(--ink)}
.err-btn.pri{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.err-btn.pri:hover{background:var(--brand-2)}
</style>
</head>
<body>
<button class="theme-tg fixed" id="themeTg" type="button" aria-pressed="false" aria-label="라이트/다크 모드 전환"><i class="i i-sun"></i><i class="i i-moon"></i></button>
<div class="err-wrap">
  <div class="err-card">
    <div class="err-brand">
      <span class="lg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 5h12l-2.6 4L17 13H5"/></svg></span>
      <span class="nm">J.O.B.<span>I.S</span></span>
    </div>
    <span class="err-pill">요청 오류</span>
    <h1 class="err-t">요청을 처리할 수 없어요</h1>
    <p class="err-s">접근 권한이 없거나 만료된 요청이에요.<br>로그인 상태를 확인해주세요.</p>
    <div class="err-acts">
      <a class="err-btn pri" href="/login.html">로그인</a>
      <a class="err-btn" href="/home.html">홈으로</a>
    </div>
  </div>
</div>
</body>
</html>
