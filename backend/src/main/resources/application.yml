spring:
  application:
    name: backend

  # === MySQL 연결 ===
  # 운영 환경에서는 systemd EnvironmentFile 등 외부 환경변수로 주입한다.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # === JPA / Hibernate ===
  jpa:
    hibernate:
      ddl-auto: validate      # 스키마의 주인은 Flyway. Hibernate는 엔티티와 테이블의 일치만 검증한다.
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # === Flyway (DB 스키마 버전관리) ===
  flyway:
    enabled: true
    locations: classpath:db/migration

# === JWT ===
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000   # 24시간

# === 가짜 AI 에이전트 서버 (별도 프로세스로 먼저 실행해야 함) ===
jobiss:
  agent:
    url: ${AGENT_WS_URL:ws://localhost:8000}          # 실시간 분석 (WebSocket)
    http-url: ${AGENT_HTTP_URL:http://localhost:8000} # 저장소 자료 파편화 (HTTP POST /extract)
