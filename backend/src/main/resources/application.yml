spring:
  application:
    name: backend

  # === MySQL 연결 ===
  # 기본값은 로컬 개발용. 다르면 환경변수로 덮어쓴다(DB_USERNAME / DB_PASSWORD).
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/jobiss?serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:ssafy}

  # === JPA / Hibernate ===
  jpa:
    hibernate:
      ddl-auto: validate      # 스키마의 주인은 Flyway. Hibernate는 "엔티티가 테이블과 맞나" 검증만.
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # === Flyway (DB 스키마 버전관리) ===
  flyway:
    enabled: true
    locations: classpath:db/migration

# === JWT ===
jwt:
  secret: ${JWT_SECRET:jobiss-dev-secret-please-change-in-production-0123456789abcdef}
  expiration-ms: 86400000   # 24시간

# === 가짜 AI 에이전트 서버 (별도 프로세스로 먼저 실행해야 함) ===
jobiss:
  agent:
    url: ${AGENT_WS_URL:ws://localhost:8000}          # 실시간 분석 (WebSocket)
    http-url: ${AGENT_HTTP_URL:http://localhost:8000} # 저장소 자료 파편화 (HTTP POST /extract)
