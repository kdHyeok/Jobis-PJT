spring:
  application:
    name: jobiss-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/jobiss}
    username: ${DB_APP_USER:jobiss_app}
    password: ${DB_APP_PASSWORD:jobiss_app_dev}
    hikari:
      maximum-pool-size: 10
      auto-commit: false
  flyway:
    enabled: true
    url: ${DB_URL:jdbc:postgresql://localhost:55432/jobiss}
    user: ${DB_MIGRATOR_USER:jobiss_migrator}
    password: ${DB_MIGRATOR_PASSWORD:jobiss_migrator_dev}
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: ${COOKIE_SECURE:false}
        same-site: lax

jobiss:
  web:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  auth:
    jwt-secret: ${JWT_SECRET:local-development-secret-change-this-before-production}
    access-token-seconds: ${ACCESS_TOKEN_SECONDS:3600}
    cookie-secure: ${COOKIE_SECURE:false}
  ai:
    base-url: ${AI_SERVER_URL:http://localhost:8000}
    shared-secret: ${AI_SHARED_SECRET:local-ai-secret}
    worker-enabled: ${AI_WORKER_ENABLED:true}
    poll-delay-ms: ${AI_POLL_DELAY_MS:3000}
    request-timeout-seconds: ${AI_HTTP_TIMEOUT_SECONDS:660}
    max-concurrent-analyses: ${AI_MAX_CONCURRENT_ANALYSES:2}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId:-background}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.jobiss: DEBUG
