spring:
  application:
    name: jobiss-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobiss}
    username: ${DB_APP_USER:jobiss_app}
    password: ${DB_APP_PASSWORD:jobiss_app_dev}
    hikari:
      maximum-pool-size: 10
      auto-commit: false
  flyway:
    enabled: true
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobiss}
    user: ${DB_MIGRATOR_USER:jobiss_migrator}
    password: ${DB_MIGRATOR_PASSWORD:jobiss_migrator_dev}
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: ${COOKIE_SECURE:false}
        same-site: lax

jobiss:
  data-protection:
    encryption-key: ${SENSITIVE_DATA_ENCRYPTION_KEY:local-sensitive-data-encryption-key-change-before-production}
    fingerprint-key: ${SENSITIVE_DATA_FINGERPRINT_KEY:local-sensitive-data-fingerprint-key-change-before-production}
  web:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5473,http://127.0.0.1:5473}
  auth:
    jwt-secret: ${JWT_SECRET:local-development-secret-change-this-before-production}
    access-token-seconds: ${ACCESS_TOKEN_SECONDS:7200}
    refresh-token-seconds: ${REFRESH_TOKEN_SECONDS:1209600}
    remember-me-refresh-token-seconds: ${REMEMBER_ME_REFRESH_TOKEN_SECONDS:2592000}
    cookie-secure: ${COOKIE_SECURE:false}
    # 같은 localhost 에 여러 스택을 띄워도 세션 쿠키가 서로를 덮지 않도록 스택마다
    # 다른 이름을 줄 수 있다(브라우저 쿠키는 포트를 구분하지 않는다).
    cookie-name: ${AUTH_COOKIE_NAME:jobiss_access}
  ai:
    base-url: ${AI_SERVER_URL:http://localhost:8400}
    shared-secret: ${AI_SHARED_SECRET:local-ai-secret}
    worker-enabled: ${AI_WORKER_ENABLED:true}
    poll-delay-ms: ${AI_POLL_DELAY_MS:3000}
    request-timeout-seconds: ${AI_HTTP_TIMEOUT_SECONDS:660}
    max-concurrent-analyses: ${AI_MAX_CONCURRENT_ANALYSES:2}
  repositories:
    token-encryption-key: ${REPOSITORY_TOKEN_ENCRYPTION_KEY:local-repository-token-key-change-before-production}
    github:
      api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
      app-id: ${GITHUB_APP_ID:}
      app-slug: ${GITHUB_APP_SLUG:}
      private-key: ${GITHUB_APP_PRIVATE_KEY:}
      redirect-uri: ${GITHUB_APP_REDIRECT_URI:http://localhost:5473/app/settings}
    gitlab:
      base-url: ${GITLAB_BASE_URL:https://gitlab.com}
      client-id: ${GITLAB_CLIENT_ID:}
      client-secret: ${GITLAB_CLIENT_SECRET:}
      redirect-uri: ${GITLAB_REDIRECT_URI:http://localhost:5473/app/settings}
  recovery:
    public-base-url: ${PUBLIC_APP_URL:http://localhost:5473}
    token-minutes: ${PASSWORD_RESET_TOKEN_MINUTES:30}
    mail-from: ${MAIL_FROM:no-reply@jobis.local}
    console-delivery: ${PASSWORD_RESET_CONSOLE_DELIVERY:true}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId:-background}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.jobiss: DEBUG
