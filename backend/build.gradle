plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    // 정적분석. CI 의 'Static analysis' 단계가 spotbugsMain 을 advisory 로 돌린다.
    id 'com.github.spotbugs' version '6.0.26'
}

group = 'com.jobiss'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-parameters', '-Xlint:deprecation']
}

// SpotBugs — 서식이 아니라 실제 버그 패턴(널 역참조·자원 누수·동시성)을 본다.
// 테스트 소스는 제외하고, 리포트는 HTML 하나만 남긴다.
spotbugs {
    ignoreFailures = true          // advisory. 정리 후 false 로 올린다.
    // effort·reportLevel 은 기본값을 쓴다. 플러그인 6.x 의 enum 상수는 Groovy 에서
    // Class 로 잡혀 "Cannot convert value 'class ...$MEDIUM'" 로 빌드가 깨진다.
}

spotbugsTest.enabled = false

tasks.named('spotbugsMain') {
    reports {
        html { required = true }
        xml { required = false }
    }
}
