services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobiss}
      POSTGRES_USER: ${POSTGRES_MIGRATOR_USER:-jobiss_migrator}
      POSTGRES_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?Set POSTGRES_MIGRATOR_PASSWORD}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-jobiss_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}
    volumes:
      - jobiss_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_MIGRATOR_USER:-jobiss_migrator} -d ${POSTGRES_DB:-jobiss}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [jobiss-internal]

  ai-server:
    build:
      context: ./ai-server
    restart: unless-stopped
    environment:
      JOBISS_AI_ENVIRONMENT: ${JOBISS_AI_ENVIRONMENT:-production}
      JOBISS_AI_SHARED_SECRET: ${AI_SHARED_SECRET:?Set AI_SHARED_SECRET}
      JOBISS_AI_ANALYSIS_PROVIDER: ${JOBISS_AI_ANALYSIS_PROVIDER:-anthropic}
      JOBISS_AI_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      JOBISS_AI_ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      JOBISS_AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-600}
      JOBISS_AI_PROGRESS_LOG_INTERVAL_SECONDS: ${AI_PROGRESS_LOG_INTERVAL_SECONDS:-10}
      JOBISS_AI_MAX_CONCURRENCY: ${AI_MAX_CONCURRENCY:-4}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [jobiss-internal]

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ai-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-jobiss}
      DB_MIGRATOR_USER: ${POSTGRES_MIGRATOR_USER:-jobiss_migrator}
      DB_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?Set POSTGRES_MIGRATOR_PASSWORD}
      DB_APP_USER: ${POSTGRES_APP_USER:-jobiss_app}
      DB_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      AI_SERVER_URL: http://ai-server:8000
      AI_SHARED_SECRET: ${AI_SHARED_SECRET:?Set AI_SHARED_SECRET}
      AI_HTTP_TIMEOUT_SECONDS: ${AI_HTTP_TIMEOUT_SECONDS:-660}
      AI_MAX_CONCURRENT_ANALYSES: ${AI_MAX_CONCURRENT_ANALYSES:-2}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS}
      LOGGING_LEVEL_COM_JOBISS: ${JOBISS_LOG_LEVEL:-INFO}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://localhost:8080/api/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [jobiss-internal]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${JOBISS_HTTP_PORT:-8088}:8080"
    networks:
      - jobiss-internal

volumes:
  jobiss_postgres_data:

networks:
  jobiss-internal:
    driver: bridge
