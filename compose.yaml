name: jobis-app

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobiss}
      POSTGRES_USER: ${POSTGRES_MIGRATOR_USER:-jobiss_migrator}
      POSTGRES_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?Set POSTGRES_MIGRATOR_PASSWORD}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-jobiss_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}
    volumes:
      - jobiss_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U ${POSTGRES_MIGRATOR_USER:-jobiss_migrator} -d ${POSTGRES_DB:-jobiss}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [jobiss-internal]

  ai:
    build:
      context: ./AI
    restart: unless-stopped
    environment:
      JOBISS_AI_SHARED_SECRET: ${AI_SHARED_SECRET:?Set AI_SHARED_SECRET}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1-mini}
      LLM_MODEL_LIGHT: ${LLM_MODEL_LIGHT:-gpt-4.1-mini}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}
      GMS_KEY: ${GMS_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      JOBIS_JINA_ENABLED: ${JOBIS_JINA_ENABLED:-true}
      JINA_API_KEY: ${JINA_API_KEY:-}
      JOBIS_FIRECRAWL_ENABLED: ${JOBIS_FIRECRAWL_ENABLED:-true}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      JOBIS_TAVILY_ENABLED: ${JOBIS_TAVILY_ENABLED:-true}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      CLOVA_API_KEY: ${CLOVA_API_KEY:-}
      CLOVA_VLM_URL: ${CLOVA_VLM_URL:-https://clovastudio.stream.ntruss.com/v3/chat-completions/HCX-005}
      CODEX_MODEL: ${CODEX_MODEL:-gpt-5.4}
      CODEX_MODEL_LIGHT: ${CODEX_MODEL_LIGHT:-gpt-5.4}
      CODEX_MODEL_ROUTER: ${CODEX_MODEL_ROUTER:-}
      CODEX_REASONING_EFFORT: ${CODEX_REASONING_EFFORT:-medium}
      CODEX_TIMEOUT_SEC: ${CODEX_TIMEOUT_SEC:-200}
      CODEX_OAUTH_STATE_DIR: /var/lib/jobis-ai/codex
      RAG_PROVIDER: ${RAG_PROVIDER:-null}
      RAG_SEARCH_URL: ${RAG_SEARCH_URL:-http://host.docker.internal:8765}
      SESSION_STORE: sqlite
      SESSION_DB_PATH: /var/lib/jobis-ai/sessions.sqlite3
      JOBIS_AUDIT_LOG: /var/lib/jobis-ai/logs/audit.jsonl
    volumes:
      - jobiss_ai_state:/var/lib/jobis-ai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [jobiss-internal]

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-jobiss}
      DB_MIGRATOR_USER: ${POSTGRES_MIGRATOR_USER:-jobiss_migrator}
      DB_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?Set POSTGRES_MIGRATOR_PASSWORD}
      DB_APP_USER: ${POSTGRES_APP_USER:-jobiss_app}
      DB_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      AI_SERVER_URL: http://ai:8000
      AI_SHARED_SECRET: ${AI_SHARED_SECRET:?Set AI_SHARED_SECRET}
      AI_HTTP_TIMEOUT_SECONDS: ${AI_HTTP_TIMEOUT_SECONDS:-660}
      AI_MAX_CONCURRENT_ANALYSES: ${AI_MAX_CONCURRENT_ANALYSES:-2}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-jobiss_access}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS}
      LOGGING_LEVEL_COM_JOBISS: ${JOBISS_LOG_LEVEL:-INFO}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://localhost:8080/api/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [jobiss-internal]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    environment:
      NGINX_PORT: "8080"
      BACKEND_UPSTREAM: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${JOBISS_HTTP_PORT:-8088}:8080"
    networks:
      - jobiss-internal

volumes:
  jobiss_postgres_data:
    name: data-airflow_jobiss_postgres_data
  jobiss_ai_state:
    name: data-airflow_jobiss_ai_state

networks:
  jobiss-internal:
    driver: bridge
