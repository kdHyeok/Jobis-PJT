# Airflow + PostgreSQL(pgvector) 일일 수집 파이프라인.
# 사용법은 README.md 참고. 비밀값은 같은 디렉토리의 .env에서 읽는다 (.env.example 복사).

x-airflow-common: &airflow-common
  build:
    context: ../..
    dockerfile: infra/airflow/Dockerfile.airflow
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Seoul
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres/airflow
    JOBRAG_PG_DSN: postgresql://jobrag:${JOBRAG_DB_PASSWORD}@postgres:5432/jobrag
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - airflow-logs:/opt/airflow/logs
    - crawl-state:/opt/jobis/DATA/data
    - crawl-exports:/opt/jobis/DATA/exports
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?}
      JOBRAG_DB_PASSWORD: ${JOBRAG_DB_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 12

  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "airflow db migrate && airflow users create
      --username admin --password ${AIRFLOW_ADMIN_PASSWORD:?}
      --firstname Admin --lastname Admin --role Admin --email admin@example.com"
    restart: "no"

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
    # DockerOperator가 rag-ingest 컨테이너를 띄울 수 있도록 도커 소켓 공유.
    # DOCKER_GID는 호스트의 docker 그룹 GID (getent group docker | cut -d: -f3)
    group_add:
      - ${DOCKER_GID:-999}
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - airflow-logs:/opt/airflow/logs
      - crawl-state:/opt/jobis/DATA/data
      - crawl-exports:/opt/jobis/DATA/exports
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  pgdata:
  airflow-logs:
  crawl-state:
    name: jobis-crawl-state
  crawl-exports:
    name: jobis-crawl-exports
  hf-cache:
    name: jobis-hf-cache

networks:
  default:
    name: jobis-net
